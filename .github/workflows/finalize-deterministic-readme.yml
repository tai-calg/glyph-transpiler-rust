name: Finalize Deterministic README

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-deterministic-readme.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer
        run: |
          python -m pip install pillow==12.0.0
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Prove deterministic rendering
        run: |
          node tests/verify_enabling_case_rendering.mjs
          node tests/verify_state_diagram_rendering.mjs
          cp build/state-diagram-regression/motor-safety-motor.png /tmp/motor-a.png
          rm -rf build/state-diagram-regression
          node tests/verify_state_diagram_rendering.mjs
          cp build/state-diagram-regression/motor-safety-motor.png /tmp/motor-b.png
          python - <<'PY'
          from pathlib import Path
          from tests.verify_readme_state_snapshot import compare_images
          changed, mean, maximum, size = compare_images(Path('/tmp/motor-a.png'), Path('/tmp/motor-b.png'))
          print(f'independent render delta: changed={changed}, mean={mean:.8f}, max={maximum}, size={size}')
          if changed > 256 or mean > 0.001 or maximum > 32:
              raise SystemExit('independent final-code renders are not deterministic')
          PY
      - name: Publish and independently reverify snapshot
        run: |
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
          rm -rf build/state-diagram-regression
          node tests/verify_state_diagram_rendering.mjs
          python tests/verify_readme_state_snapshot.py
          rm .github/workflows/finalize-deterministic-readme.yml
      - name: Commit only verified outputs
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/glyph-studio-state-transition.png
          git add -u .github/workflows/finalize-deterministic-readme.yml
          git commit -m "Refresh deterministic Input and Guard snapshot"
          git push origin "HEAD:${HEAD_REF}"
