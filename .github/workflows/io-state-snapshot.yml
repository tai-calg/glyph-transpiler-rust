name: I/O State Diagram Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/io-state-snapshot.yml"

permissions:
  contents: write

jobs:
  publish-merge-snapshot:
    if: ${{ github.head_ref == 'agent/fix-transition-action-source' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install renderer dependencies
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Generate and verify merge-context README image
        shell: bash
        env:
          UPDATE_README_STATE_DIAGRAM: "1"
        run: |
          set -euo pipefail
          mkdir -p build/state-diagram-regression
          node tests/verify_state_diagram_rendering.mjs
          python tests/verify_readme_state_snapshot.py
          cp docs/images/glyph-studio-state-transition.png /tmp/glyph-studio-state-transition.png

      - name: Publish image to PR branch and restore workflow
        shell: bash
        env:
          TARGET_BRANCH: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}" main --depth=1
          git checkout -B "${TARGET_BRANCH}" "origin/${TARGET_BRANCH}"
          cp /tmp/glyph-studio-state-transition.png docs/images/glyph-studio-state-transition.png
          git checkout origin/main -- .github/workflows/io-state-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/glyph-studio-state-transition.png .github/workflows/io-state-snapshot.yml
          git diff --cached --exit-code && { echo "No merge-context snapshot change"; exit 1; } || true
          git commit -m "Align README state diagram with PR merge semantics"
          git push origin HEAD:"${TARGET_BRANCH}"

      - name: Upload merge-context rendering
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merge-context-state-diagram
          if-no-files-found: warn
          path: |
            build/state-diagram-regression/**
            docs/images/glyph-studio-state-transition.png
