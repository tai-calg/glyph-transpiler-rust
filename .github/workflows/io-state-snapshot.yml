      - "tests/verify_readme_state_snapshot.py"
      - "tests/verify_state_diagram_stability.mjs"
      - "tests/verify_uml_transition_semantics.mjs"
      - "tests/verify_additional_failure_notation.mjs"
      - "tests/verify_diagram_editor_exports.mjs"
      - "tests/verify_diagram_canvas_viewport.mjs"
      - "tests/verify_localized_semantic_canvas.mjs"
