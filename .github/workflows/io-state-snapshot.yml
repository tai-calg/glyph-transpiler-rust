      - "docs/design/state-transition-action-scopes-v1.md"
      - "docs/design/transition-input-action-provenance-v1.md"
      - "docs/design/transition-enabling-cases-v1.md"
      - "docs/images/glyph-studio-state-transition.png"
      - ".github/workflows/io-state-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and image verifier
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Compile and verify state diagrams
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/checked-system-context-io build/execution-context-selection build/rtai-strict-projection build/state-diagram-regression build/state-diagram-stability build/uml-transition-semantics build/additional-failure-notation build/diagram-editor-exports build/diagram-canvas-viewport build/localized-semantic-canvas build/transition-label-readability build/transition-layout-transaction build/transition-semantic-readability

          run_node() {
            local script="$1"
            local log="$2"
            echo "::group::${script}"
            timeout 180s node "${script}" 2>&1 | tee "${log}"
            echo "::endgroup::"
          }

          python -m unittest discover -s tests -p 'test_rtai_semantic_status.py'
          python -m unittest discover -s tests -p 'test_rtai_targeted_witnesses.py'
          python -m unittest discover -s tests -p 'test_rtai_witness_generation.py'
          python -m unittest discover -s tests -p 'test_transition_action_target_independence.py'
          python -m unittest discover -s tests -p 'test_transition_enabling_cases.py'
          python -m unittest discover -s tests -p 'test_transition_execution_context_selector.py'
          python -m unittest discover -s tests -p 'test_transition_input_provenance.py'
          python -m unittest discover -s tests -p 'test_transition_system_execution_control_flow.py'
          python -m unittest discover -s tests -p 'test_transition_system_execution_review_regressions.py'
          python -m unittest discover -s tests -p 'test_transition_system_execution_safety.py'
          python tests/verify_rtai_strict_projection_snapshot.py \
            2>&1 | tee build/rtai-strict-projection/verify.log
          run_node tests/verify_rtai_strict_projection_ui.mjs build/rtai-strict-projection/ui-verify.log
          run_node tests/verify_code_derived_system_io.mjs build/checked-system-context-io/verify.log
          run_node tests/verify_execution_context_selection.mjs build/execution-context-selection/verify.log
          run_node tests/verify_enabling_case_rendering.mjs build/state-diagram-regression/enabling-cases.log
          run_node tests/verify_state_diagram_rendering.mjs build/state-diagram-regression/verify.log
          python tests/verify_readme_state_snapshot.py \
            2>&1 | tee -a build/state-diagram-regression/verify.log
          run_node tests/verify_state_diagram_stability.mjs build/state-diagram-stability/verify.log
          run_node tests/verify_uml_transition_semantics.mjs build/uml-transition-semantics/verify.log
          run_node tests/verify_additional_failure_notation.mjs build/additional-failure-notation/verify.log
          run_node tests/verify_transition_layout_transaction.mjs build/transition-layout-transaction/verify.log
          run_node tests/verify_diagram_editor_exports.mjs build/diagram-editor-exports/verify.log
          run_node tests/verify_diagram_canvas_viewport.mjs build/diagram-canvas-viewport/verify.log
          run_node tests/verify_localized_semantic_canvas.mjs build/localized-semantic-canvas/verify.log
          run_node tests/verify_transition_label_readability.mjs build/transition-label-readability/verify.log
          run_node tests/verify_transition_semantic_readability.mjs build/transition-semantic-readability/verify.log

      - name: Upload rendered diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-diagram-regression
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            build/checked-system-context-io/**
            build/execution-context-selection/**
            build/rtai-strict-projection/**
            build/state-diagram-regression/**
            build/state-diagram-stability/**
            build/uml-transition-semantics/**
            build/additional-failure-notation/**
            build/diagram-editor-exports/**
            build/diagram-canvas-viewport/**
            build/localized-semantic-canvas/**
            build/transition-label-readability/**
            build/transition-layout-transaction/**
            build/transition-semantic-readability/**
            examples/acceptance/door_controller.glyph
            examples/acceptance/door_execution_contexts.glyph
            examples/acceptance/motor_safety.glyph
            examples/acceptance/rtai_strict_projection.glyph
            examples/state_diagrams/*.glyph
            examples/acceptance/.glyph/**/io-state-views.json
            examples/state_diagrams/.glyph/**/io-state-views.json
