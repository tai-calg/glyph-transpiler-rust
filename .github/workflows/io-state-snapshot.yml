name: I/O State Diagram Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - "glyph.py"
      - "glyph/architecture.py"
      - "glyph/code_derived_system_ui.py"
      - "glyph/diagnostic_i18n.py"
      - "glyph/diagnostic_localization.py"
      - "glyph/diagram_app.py"
      - "glyph/diagram_ui.py"
      - "glyph/diagram_canvas_navigation.py"
      - "glyph/diagram_canvas_viewport.py"
      - "glyph/diagram_editor_exports.py"
      - "glyph/diagram_label_editor.py"
      - "glyph/diagram_locale.py"
      - "glyph/diagram_render_stability.py"
      - "glyph/diagram_workspace_layout.py"
      - "glyph/initial_transition_layout.py"
      - "glyph/readable_diagram_app.py"
      - "glyph/state_transition_ir.py"
      - "glyph/state_transition_compiler.py"
      - "glyph/state_transition_block_lowering.py"
      - "glyph/state_transition_pipeline.py"
      - "glyph/state_transition_ir_renderer.py"
      - "glyph/transition_condition_roles.py"
      - "glyph/transition_io_clusters.py"
      - "glyph/transition_io_collision_solver.py"
      - "glyph/transition_label_drag_guard.py"
      - "glyph/transition_label_layout.py"
      - "glyph/transition_label_readability.py"
      - "glyph/transition_node_layout_guard.py"
      - "glyph/transition_readable_exports.py"
      - "glyph/transition_readable_layout.py"
      - "glyph/transition_route_labels.py"
      - "glyph/transition_semantics.py"
      - "glyph/transition_semantics_runtime.py"
      - "glyph/uml_transition_layout.py"
      - "glyph/io_state_views.py"
      - "glyph/state_machine_analysis.py"
      - "glyph/state_machine_source_map.py"
      - "tests/test_code_derived_system_ui.py"
      - "tests/test_diagnostic_localization.py"
      - "tests/test_diagram_canvas_viewport.py"
      - "tests/test_diagram_editor_exports.py"
      - "tests/test_diagram_locale_navigation.py"
      - "tests/test_diagram_render_stability.py"
      - "tests/test_diagram_workspace_layout.py"
      - "tests/test_initial_transition_layout.py"
      - "tests/test_io_state_diagram_app.py"
      - "tests/test_state_machine_source_map.py"
      - "tests/test_state_diagram_examples.py"
      - "tests/test_state_transition_ir_renderer.py"
      - "tests/test_transition_io_clusters.py"
      - "tests/test_transition_label_drag_guard.py"
      - "tests/test_transition_label_layout.py"
      - "tests/test_transition_label_readability.py"
      - "tests/test_transition_node_layout_guard.py"
      - "tests/test_transition_readable_exports.py"
      - "tests/test_transition_readable_layout.py"
      - "tests/test_transition_route_labels.py"
      - "tests/test_transition_semantics.py"
      - "tests/verify_code_derived_system_io.mjs"
      - "tests/verify_state_diagram_rendering.mjs"
      - "tests/verify_state_diagram_stability.mjs"
      - "tests/verify_uml_transition_semantics.mjs"
      - "tests/verify_additional_failure_notation.mjs"
      - "tests/verify_diagram_editor_exports.mjs"
      - "tests/verify_diagram_canvas_viewport.mjs"
      - "tests/verify_localized_semantic_canvas.mjs"
      - "tests/verify_transition_label_readability.mjs"
      - "tests/verify_transition_semantic_readability.mjs"
      - "examples/acceptance/door_controller.glyph"
      - "examples/acceptance/motor_safety.glyph"
      - "examples/state_diagrams/**"
      - "docs/PROVISIONAL_TRIGGER_CLASSIFICATION.md"
      - ".github/workflows/io-state-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser
        run: |
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Compile and verify state diagrams
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/checked-system-context-io build/state-diagram-regression build/state-diagram-stability build/uml-transition-semantics build/additional-failure-notation build/diagram-editor-exports build/diagram-canvas-viewport build/localized-semantic-canvas build/transition-label-readability build/transition-semantic-readability
          node tests/verify_code_derived_system_io.mjs \
            2>&1 | tee build/checked-system-context-io/verify.log
          node tests/verify_state_diagram_rendering.mjs \
            2>&1 | tee build/state-diagram-regression/verify.log
          node tests/verify_state_diagram_stability.mjs \
            2>&1 | tee build/state-diagram-stability/verify.log
          node tests/verify_uml_transition_semantics.mjs \
            2>&1 | tee build/uml-transition-semantics/verify.log
          node tests/verify_additional_failure_notation.mjs \
            2>&1 | tee build/additional-failure-notation/verify.log
          node tests/verify_diagram_editor_exports.mjs \
            2>&1 | tee build/diagram-editor-exports/verify.log
          node tests/verify_diagram_canvas_viewport.mjs \
            2>&1 | tee build/diagram-canvas-viewport/verify.log
          node tests/verify_localized_semantic_canvas.mjs \
            2>&1 | tee build/localized-semantic-canvas/verify.log
          node tests/verify_transition_label_readability.mjs \
            2>&1 | tee build/transition-label-readability/verify.log
          node tests/verify_transition_semantic_readability.mjs \
            2>&1 | tee build/transition-semantic-readability/verify.log

      - name: Upload rendered diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-diagram-regression
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            build/checked-system-context-io/**
            build/state-diagram-regression/**
            build/state-diagram-stability/**
            build/uml-transition-semantics/**
            build/additional-failure-notation/**
            build/diagram-editor-exports/**
            build/diagram-canvas-viewport/**
            build/localized-semantic-canvas/**
            build/transition-label-readability/**
            build/transition-semantic-readability/**
            examples/acceptance/door_controller.glyph
            examples/acceptance/motor_safety.glyph
            examples/state_diagrams/*.glyph
            examples/acceptance/.glyph/**/io-state-views.json
            examples/state_diagrams/.glyph/**/io-state-views.json
