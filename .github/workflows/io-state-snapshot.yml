name: I/O State Diagram Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/io-state-snapshot.yml"

permissions:
  contents: write

jobs:
  finalize-pr55:
    if: ${{ github.head_ref == 'agent/fix-transition-action-source' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and image verifier
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Align regressions with operation-derived Action semantics
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(source: str, old: str, new: str, filename: str) -> str:
              if old not in source:
                  raise SystemExit(f"expected text not found in {filename}: {old}")
              return source.replace(old, new, 1)

          uml_path = Path("tests/verify_uml_transition_semantics.mjs")
          uml = uml_path.read_text(encoding="utf-8")
          compact = {
              "Pump": [
                  "PumpStart➡︎write_pump(true)",
                  "PumpStop➡︎write_pump(false)",
                  "PumpStart➡︎write_pump(true) | WriteError",
                  "PumpStop➡︎write_pump(false) | WriteError",
              ],
              "Conveyor": [
                  "ConveyorStart [input.clear]➡︎set_conveyor(input.speed)",
                  "ConveyorStop➡︎set_conveyor(0.0)",
                  "ConveyorReset [input.clear]➡︎set_conveyor(0.0)",
                  "ConveyorStart [input.clear]➡︎set_conveyor(input.speed) | DriveError",
              ],
              "Valve": [
                  "ValveOpenRequest➡︎write_valve(true)",
                  "ValveCloseRequest➡︎write_valve(false)",
                  "ValveOpenRequest➡︎write_valve(true) | ValveError",
              ],
          }
          for machine, labels in compact.items():
              machine_at = uml.index(f'machine: "{machine}",')
              start = uml.index("    compactLabels: [", machine_at)
              end = uml.index("    ],", start) + len("    ],")
              rendered = "    compactLabels: [\n" + "\n".join(
                  f'      "{label}",' for label in labels
              ) + "\n    ],"
              uml = uml[:start] + rendered + uml[end:]
          uml_path.write_text(uml, encoding="utf-8")

          additional_path = Path("tests/verify_additional_failure_notation.mjs")
          additional = additional_path.read_text(encoding="utf-8")
          first_start = additional.index("      for (const effect of testCase.expectedEffects) {")
          first_end = additional.index("\n\n      await fs.writeFile(", first_start)
          first = '''      for (const effect of testCase.expectedEffects) {
                const witnesses = machine.transitions.filter(transition => (
                  actionDisplay(transition) === effect
                  && (transition.action_invocations || []).some(invocation => invocation.expression === effect)
                  && (transition.effect_invocations || []).some(invocation => invocation.expression === effect)
                  && transition.action?.effectful === true
                ));
                assert(
                  witnesses.length > 0,
                  `${testCase.machine}: missing Action/Effect dual-role witness: ${effect}`,
                );
              }'''
          additional = additional[:first_start] + first + additional[first_end:]
          visible_at = additional.index("      const visible =")
          second_start = additional.index("      for (const effect of testCase.expectedEffects) {", visible_at)
          second_end = additional.index(
              '\n      assert(\n        visible.every(label => !label.includes("➡︎—"))',
              second_start,
          )
          second = '''      for (const effect of testCase.expectedEffects) {
                assert(
                  visible.some(label => label.includes(`➡︎${effect}`)),
                  `${testCase.machine}: operation-derived Action is not visible: ${effect}`,
                );
              }'''
          additional = additional[:second_start] + second + additional[second_end:]
          additional = replace_once(
              additional,
              "verified ${cases.length} additional diagrams with separate Action, Effect, and failure notation",
              "verified ${cases.length} additional diagrams with operation Actions, Effect metadata, and failure notation",
              str(additional_path),
          )
          additional_path.write_text(additional, encoding="utf-8")

          export_path = Path("tests/verify_diagram_editor_exports.mjs")
          export = export_path.read_text(encoding="utf-8")
          export = replace_once(
              export,
              'assert(!markup.includes("set_conveyor"), "SVG export leaked Effect invocation into Action labels");',
              'assert(markup.includes("set_conveyor"), "SVG export omitted operation-derived Action labels");',
              str(export_path),
          )
          export = replace_once(
              export,
              'assert(!markup.includes(" ➞ "), "SVG export synthesized an Action for a machine without action projection");',
              'assert(markup.includes(" ➞ "), "SVG export omitted the I/O separator");',
              str(export_path),
          )
          export_path.write_text(export, encoding="utf-8")

          for filename, old, new in [
              ("tests/verify_transition_label_readability.mjs", 'requiredLabel: "ConveyorStop"', 'requiredLabel: "ConveyorStop ➞ set_conveyor(0.0)"'),
              ("tests/verify_transition_semantic_readability.mjs", 'required: "ConveyorStop"', 'required: "ConveyorStop ➞ set_conveyor(0.0)"'),
          ]:
              path = Path(filename)
              source = replace_once(path.read_text(encoding="utf-8"), old, new, filename)
              path.write_text(source, encoding="utf-8")
          PY

      - name: Compile and verify state diagrams
        shell: bash
        env:
          UPDATE_README_STATE_DIAGRAM: "1"
        run: |
          set -o pipefail
          mkdir -p build/checked-system-context-io build/state-diagram-regression build/state-diagram-stability build/uml-transition-semantics build/additional-failure-notation build/diagram-editor-exports build/diagram-canvas-viewport build/localized-semantic-canvas build/transition-label-readability build/transition-layout-transaction build/transition-semantic-readability
          python -m unittest discover -s tests -p 'test_transition_action_target_independence.py'
          python -m unittest discover -s tests -p 'test_transition_enabling_cases.py'
          python -m unittest discover -s tests -p 'test_transition_input_provenance.py'
          python -m unittest discover -s tests -p 'test_transition_operation_actions.py'
          node tests/verify_code_derived_system_io.mjs 2>&1 | tee build/checked-system-context-io/verify.log
          node tests/verify_enabling_case_rendering.mjs 2>&1 | tee build/state-diagram-regression/enabling-cases.log
          node tests/verify_state_diagram_rendering.mjs 2>&1 | tee build/state-diagram-regression/verify.log
          python tests/verify_readme_state_snapshot.py 2>&1 | tee -a build/state-diagram-regression/verify.log
          node tests/verify_state_diagram_stability.mjs 2>&1 | tee build/state-diagram-stability/verify.log
          node tests/verify_uml_transition_semantics.mjs 2>&1 | tee build/uml-transition-semantics/verify.log
          node tests/verify_additional_failure_notation.mjs 2>&1 | tee build/additional-failure-notation/verify.log
          node tests/verify_transition_layout_transaction.mjs 2>&1 | tee build/transition-layout-transaction/verify.log
          node tests/verify_diagram_editor_exports.mjs 2>&1 | tee build/diagram-editor-exports/verify.log
          node tests/verify_diagram_canvas_viewport.mjs 2>&1 | tee build/diagram-canvas-viewport/verify.log
          node tests/verify_localized_semantic_canvas.mjs 2>&1 | tee build/localized-semantic-canvas/verify.log
          node tests/verify_transition_label_readability.mjs 2>&1 | tee build/transition-label-readability/verify.log
          node tests/verify_transition_semantic_readability.mjs 2>&1 | tee build/transition-semantic-readability/verify.log

      - name: Publish verified files and restore normal workflow
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/io-state-snapshot.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            docs/images/glyph-studio-state-transition.png \
            tests/verify_uml_transition_semantics.mjs \
            tests/verify_additional_failure_notation.mjs \
            tests/verify_diagram_editor_exports.mjs \
            tests/verify_transition_label_readability.mjs \
            tests/verify_transition_semantic_readability.mjs \
            .github/workflows/io-state-snapshot.yml
          git diff --cached --exit-code && { echo "No verified update was produced"; exit 1; } || true
          git commit -m "Publish operation-derived Action state diagram"
          git push origin HEAD:${{ github.head_ref }}

      - name: Upload rendered diagrams
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-diagram-regression
          include-hidden-files: true
          if-no-files-found: warn
          path: |
            build/**
            examples/acceptance/.glyph/**/io-state-views.json
            examples/state_diagrams/.glyph/**/io-state-views.json
