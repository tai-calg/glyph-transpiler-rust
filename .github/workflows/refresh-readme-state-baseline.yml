name: Refresh README State Baseline

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing
    paths:
      - ".github/workflows/refresh-readme-state-baseline.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Regenerate verified README state diagram
        run: |
          set -euo pipefail
          mkdir -p build/state-diagram-regression
          timeout 180s node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
          python tests/verify_readme_state_snapshot.py
      - name: Commit baseline
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/glyph-studio-state-transition.png
          if git diff --cached --quiet; then
            echo "README state baseline is already current"
            exit 0
          fi
          git commit -m "Refresh README state diagram baseline"
          git push origin HEAD:agent/machine-assembly-immediate-routing
