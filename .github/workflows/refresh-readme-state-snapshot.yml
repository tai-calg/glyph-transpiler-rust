name: Refresh README State Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/refresh-readme-state-snapshot.yml"
      - "examples/acceptance/motor_safety.glyph"
      - "glyph/transition_action_target_independence.py"
      - "glyph/state_transition_pipeline.py"
      - "tests/verify_readme_state_snapshot.py"
      - "tests/verify_state_diagram_rendering.mjs"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Render and verify generic semantics
        run: |
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
          python tests/verify_readme_state_snapshot.py
      - name: Commit generated PNG
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet -- docs/images/glyph-studio-state-transition.png; then
            echo "README state snapshot already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/glyph-studio-state-transition.png
          git commit -m "Refresh README snapshot from generic Action semantics"
          git push origin "HEAD:${HEAD_REF}"
