name: Refresh Enabling Case README

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/refresh-enabling-case-readme.yml"

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer and verifier
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify semantics and refresh PNG
        run: |
          python -m unittest discover -s tests -p 'test_transition_enabling_cases.py'
          python -m unittest discover -s tests -p 'test_transition_input_provenance.py'
          node tests/verify_enabling_case_rendering.mjs
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
          python tests/verify_readme_state_snapshot.py
      - name: Align additive IR version constant
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('glyph/transition_enabling_cases.py')
          text = path.read_text(encoding='utf-8')
          old = 'STATE_TRANSITION_IR_VERSION = 5'
          if old not in text:
              raise SystemExit('stale StateTransitionIR version constant not found')
          path.write_text(text.replace(old, 'STATE_TRANSITION_IR_VERSION = 4', 1), encoding='utf-8')
          Path('.github/workflows/refresh-enabling-case-readme.yml').unlink()
          PY
      - name: Commit verified snapshot
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish verified Input and Guard state diagram"
          git push origin "HEAD:${HEAD_REF}"
