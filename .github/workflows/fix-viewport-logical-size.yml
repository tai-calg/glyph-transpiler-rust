name: Repair Viewport Logical Size

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-viewport-logical-size.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/system-entry-source-sink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-entry-source-sink
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply logical-size repair
        run: |
          set -euo pipefail
          python3 scripts/fix_viewport_logical_size_once.py
          python3 -m unittest tests.test_diagram_canvas_viewport -v
          git add -A glyph/diagram_canvas_viewport.py tests/test_diagram_canvas_viewport.py scripts/fix_viewport_logical_size_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Keep viewport logical size independent of zoom"
          git push origin HEAD:agent/system-entry-source-sink
