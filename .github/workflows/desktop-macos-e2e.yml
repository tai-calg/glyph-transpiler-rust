name: Desktop macOS E2E

on:
  pull_request:
    paths:
      - "desktop/**"
      - "glyph/**"
      - "tests/**"
      - ".github/workflows/desktop-macos-e2e.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "desktop/**"
      - "glyph/**"
      - "tests/**"
      - ".github/workflows/desktop-macos-e2e.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Glyph desktop Python dependencies
        run: python -m pip install -e '.[desktop]'

      - name: Install Desktop JavaScript dependencies
        run: npm install --prefix desktop

      - name: Run native Tauri E2E with embedded WebDriver
        run: npm run e2e --prefix desktop
