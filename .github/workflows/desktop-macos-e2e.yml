name: Desktop macOS E2E

on:
  pull_request:
    paths:
      - "desktop/**"
      - "glyph/**"
      - "tests/**"
      - ".github/workflows/desktop-macos-e2e.yml"
      - "pyproject.toml"
  push:
    branches:
      - main
      - "agent/**"
    paths:
      - "desktop/**"
      - "glyph/**"
      - "tests/**"
      - ".github/workflows/desktop-macos-e2e.yml"
      - "pyproject.toml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Glyph desktop Python dependencies
        run: python -m pip install -e '.[desktop]'

      - name: Install Desktop JavaScript dependencies
        run: npm install --prefix desktop

      - name: Check E2E-enabled Tauri backend
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml --features desktop-e2e

      - name: Build E2E-enabled Tauri binary
        run: npm run build:e2e --prefix desktop

      - name: Verify native executable
        shell: bash
        run: |
          set -euo pipefail
          test -x desktop/src-tauri/target/debug/glyph-desktop
          file desktop/src-tauri/target/debug/glyph-desktop

      - name: Run native GUI E2E with embedded WebDriver
        run: npm exec --prefix desktop -- wdio run ./wdio.conf.js
