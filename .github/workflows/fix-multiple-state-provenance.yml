name: Fix multiple-state provenance

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-action-control-flow-completeness-v2
          fetch-depth: 0

      - name: Apply and verify provenance fix
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/apply_fix.py
          python /tmp/apply_fix.py
          python -m py_compile glyph/transition_system_execution_control_flow.py
          python -m unittest tests.test_transition_system_execution_safety tests.test_transition_system_execution_control_flow tests.test_transition_system_execution_review_regressions
          python -m unittest discover -s tests -p 'test_transition*.py'
          python -m unittest discover -s tests

      - name: Commit verified fix
        shell: bash
        run: |
          rm -f libgenerated.rlib libhost_binding.rlib
          git rm .github/workflows/fix-multiple-state-provenance.yml
          git rm .github/fix-multiple-state-provenance.trigger
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glyph/transition_system_execution_control_flow.py tests/test_transition_system_execution_safety.py
          git commit -m "Require named current-state wiring"
          git push origin HEAD:agent/system-action-control-flow-completeness-v2
