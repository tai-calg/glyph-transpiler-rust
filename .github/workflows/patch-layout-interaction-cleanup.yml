name: Patch Layout Interaction Cleanup

on:
  push:
    branches:
      - agent/system-action-control-flow-completeness-v2

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'tai-calg/glyph-transpiler-rust' &&
      !contains(github.event.head_commit.message, '[skip-layout-interaction-cleanup]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-action-control-flow-completeness-v2
          fetch-depth: 1

      - name: Remove stale cluster click listener and normalize missing storage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          clusters = Path('glyph/transition_io_clusters.py')
          text = clusters.read_text(encoding='utf-8')
          stale = 'document.addEventListener("click",event=>{if(!event.target?.closest?.(".transition-io-cluster"))select(null)});'
          if stale not in text:
              raise SystemExit('stale cluster select listener not found')
          text = text.replace(stale, '', 1)
          if 'select(null)' in text:
              raise SystemExit('stale select(null) remains')
          clusters.write_text(text, encoding='utf-8')

          test = Path('tests/verify_transition_layout_transaction.mjs')
          text = test.read_text(encoding='utf-8')
          old = 'return key ? JSON.parse(localStorage.getItem(key) || "{}")[id] : null;'
          new = 'return key ? (JSON.parse(localStorage.getItem(key) || "{}")[id] ?? null) : null;'
          if old not in text:
              raise SystemExit('manual layout storage normalization target not found')
          test.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/transition_io_clusters.py tests/verify_transition_layout_transaction.mjs
          git commit -m "Finalize transition interaction ownership [skip-layout-interaction-cleanup]"
          git push origin HEAD:agent/system-action-control-flow-completeness-v2
