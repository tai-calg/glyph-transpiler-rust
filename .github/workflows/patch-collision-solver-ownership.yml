name: Patch Collision Solver Ownership

on:
  push:
    branches:
      - agent/system-action-control-flow-completeness-v2

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'tai-calg/glyph-transpiler-rust' &&
      !contains(github.event.head_commit.message, '[skip-collision-ownership-patch]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-action-control-flow-completeness-v2
          fetch-depth: 1

      - name: Remove pointer ownership from collision solver
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('glyph/transition_io_collision_solver.py')
          text = path.read_text(encoding='utf-8')
          old = 'let timer=null,running=false,manualPointer=null;'
          if old not in text:
              raise SystemExit('legacy collision pointer state not found')
          text = text.replace(old, 'let timer=null,running=false;', 1)

          patterns = [
              r'document\.addEventListener\("pointerdown",event=>\{const cluster=.*?\},true\);\n',
              r'document\.addEventListener\("pointerup",event=>\{if\(!manualPointer\)return;.*?schedule\(value\.stage,0\)\},true\);\n',
          ]
          for pattern in patterns:
              text, count = re.subn(pattern, '', text, count=1, flags=re.DOTALL)
              if count != 1:
                  raise SystemExit(f'pointer listener replacement count={count}: {pattern}')

          for token in ['manualPointer', 'cluster.dataset.manualIo="true"']:
              if token in text:
                  raise SystemExit(f'collision solver still owns manual interaction: {token}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/transition_io_collision_solver.py
          git commit -m "Remove pointer ownership from collision solver [skip-collision-ownership-patch]"
          git push origin HEAD:agent/system-action-control-flow-completeness-v2
