name: Finalize Adaptive State Layout

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/finalize-adaptive-state-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-state-layout-initial-node'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-state-layout-initial-node
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Move adaptive geometry before publication
        run: |
          set -euo pipefail
          python3 scripts/finalize_adaptive_state_layout_once.py
          python3 -m py_compile glyph/state_diagram_workspace.py glyph/adaptive_state_focus.py
          git diff --check
          git add -A glyph/state_diagram_workspace.py glyph/adaptive_state_focus.py tests/verify_adaptive_state_workspace.mjs tests/test_layout_state_diagram_workspace.py scripts/finalize_adaptive_state_layout_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Publish adaptive state geometry atomically"
          git push origin HEAD:agent/adaptive-state-layout-initial-node
