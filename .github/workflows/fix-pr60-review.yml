name: Fix PR60 review findings

on:
  push:
    branches:
      - agent/system-action-control-flow-completeness-v2
    paths:
      - .github/pr60-review-fix-trigger

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-action-control-flow-completeness-v2
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply fixes
        shell: bash
        run: |
          set -euo pipefail
          base64 --decode .github/pr60-review-fix.payload | gzip --decompress > /tmp/fix_pr60.py
          python /tmp/fix_pr60.py

      - name: Run focused regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest tests.test_transition_system_execution_safety
          python -m unittest tests.test_transition_execution_context_selector
          python -m unittest discover -s tests -p 'test_transition_*.py'

      - name: Commit verified fixes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-pr60-review.yml .github/pr60-review-fix.payload .github/pr60-review-fix-trigger
          git add -A
          git commit -m "Prove System inputs and harden context projection"
          git push origin HEAD:agent/system-action-control-flow-completeness-v2
