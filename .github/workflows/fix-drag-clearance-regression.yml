name: Fix Drag Clearance Regression

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-drag-clearance-regression.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-state-layout-initial-node'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-state-layout-initial-node
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Allow drags that do not worsen existing clearance
        run: |
          set -euo pipefail
          python3 scripts/fix_drag_from_preexisting_clearance_once.py
          python3 -m py_compile glyph/transition_node_position_adapter.py tests/test_transition_node_position_adapter.py
          python3 -m unittest tests.test_transition_node_position_adapter
          git diff --check
          git add -A glyph/transition_node_position_adapter.py tests/test_transition_node_position_adapter.py scripts/fix_drag_from_preexisting_clearance_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Allow node drags out of pre-existing clearance conflicts"
          git push origin HEAD:agent/adaptive-state-layout-initial-node
