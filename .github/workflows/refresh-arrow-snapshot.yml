name: Refresh Arrow Snapshot

on:
  push:
    branches:
      - agent/state-transition-arrow-clearance
    paths:
      - ".github/workflows/refresh-arrow-snapshot.yml"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/state-transition-arrow-clearance
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install renderer dependencies
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Regenerate canonical README state diagram
        run: |
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
      - name: Commit regenerated image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/glyph-studio-state-transition.png
          git commit -m "Refresh state transition diagram snapshot"
          git push origin HEAD:agent/state-transition-arrow-clearance
