name: Enable Pytest Collection Once

on:
  push:
    branches:
      - agent/system-action-control-flow-completeness-v2
    paths:
      - ".github/workflows/enable-pytest-collection-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-action-control-flow-completeness-v2

      - name: Make all Python tests collectible
        run: |
          python - <<'PY'
          from pathlib import Path

          ci = Path('.github/workflows/ci.yml')
          source = ci.read_text(encoding='utf-8')
          old = '''      - name: Run Python compiler tests
        id: python_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -v 2>&1 | tee python-test.log
'''
          new = '''      - name: Install Python test runner
        run: python3 -m pip install pytest==8.3.5

      - name: Run Python compiler tests
        id: python_tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          python3 -m pytest -q tests 2>&1 | tee python-test.log
'''
          if old not in source:
              raise SystemExit('CI unittest block not found')
          ci.write_text(source.replace(old, new, 1), encoding='utf-8')

          certified = Path('.github/workflows/certified-layout.yml')
          source = certified.read_text(encoding='utf-8')
          source = source.replace(
              'python -m pip install pillow==12.0.0',
              'python -m pip install pillow==12.0.0 pytest==8.3.5',
              1,
          )
          old = '''      - name: Verify geometry contracts
        run: |
          python -m unittest tests.test_diagram_fit_stability
          python -m unittest tests.test_diagram_geometry_kernel
          python -m unittest tests.test_initial_transition_dependency_bridge
          python -m unittest tests.test_initial_transition_layout
          python -m unittest discover -s tests -p 'test_layout_*.py'
          python -m unittest tests.test_state_viewport_reservation
          python -m unittest tests.test_transition_layout_transaction
'''
          new = '''      - name: Verify geometry contracts
        run: |
          python -m pytest -q \
            tests/test_diagram_fit_stability.py \
            tests/test_diagram_geometry_kernel.py \
            tests/test_initial_transition_dependency_bridge.py \
            tests/test_initial_transition_layout.py \
            tests/test_layout_*.py \
            tests/test_state_viewport_reservation.py \
            tests/test_transition_layout_transaction.py
'''
          if old not in source:
              raise SystemExit('Certified geometry block not found')
          certified.write_text(source.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit migration and remove one-time workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/enable-pytest-collection-once.yml
          git add .github/workflows/ci.yml .github/workflows/certified-layout.yml
          git diff --cached --check
          git commit -m "Collect all Python tests with pytest"
          git push origin HEAD:agent/system-action-control-flow-completeness-v2
