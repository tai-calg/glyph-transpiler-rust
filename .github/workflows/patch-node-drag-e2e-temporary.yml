name: Temporary Node Drag E2E Patch

on:
  push:
    branches:
      - agent/macro-space-syntax

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macro-space-syntax
      - name: Use a directly hittable drag point
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/verify_diagram_editor_exports.mjs')
          text = path.read_text()
          old = '''async function drag(page, locator, dx, dy, name) {
            const before = await locator.boundingBox();
            assert(before, `${name} has no bounding box`);
            const x = before.x + before.width / 2;
            const y = before.y + before.height / 2;
            await page.mouse.move(x, y);
            await page.mouse.down();
            await page.mouse.move(x + dx, y + dy, { steps: 10 });
            await page.mouse.up();
            const after = await locator.boundingBox();
            assert(after, `${name} disappeared after drag`);
            return Math.abs(after.x - before.x) > 3 || Math.abs(after.y - before.y) > 3;
          }
          '''
          new = '''async function directlyHittablePoint(locator) {
            return locator.evaluate(element => {
              const rect = element.getBoundingClientRect();
              const candidates = [
                [0.5, 0.5], [0.5, 0.25], [0.5, 0.75],
                [0.25, 0.5], [0.75, 0.5],
                [0.25, 0.25], [0.75, 0.25],
                [0.25, 0.75], [0.75, 0.75],
              ];
              for (const [rx, ry] of candidates) {
                const x = rect.left + rect.width * rx;
                const y = rect.top + rect.height * ry;
                const hit = document.elementFromPoint(x, y);
                if (hit && (hit === element || element.contains(hit))) return { x, y };
              }
              return null;
            });
          }

          async function drag(page, locator, dx, dy, name) {
            const before = await locator.boundingBox();
            assert(before, `${name} has no bounding box`);
            const point = await directlyHittablePoint(locator);
            if (!point) return false;
            await page.mouse.move(point.x, point.y);
            await page.mouse.down();
            await page.mouse.move(point.x + dx, point.y + dy, { steps: 10 });
            await page.mouse.up();
            const after = await locator.boundingBox();
            assert(after, `${name} disappeared after drag`);
            return Math.abs(after.x - before.x) > 3 || Math.abs(after.y - before.y) > 3;
          }
          '''
          if old not in text:
              raise SystemExit('drag helper anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/verify_diagram_editor_exports.mjs
          git commit -m 'Use directly hittable node drag points'
          git push origin HEAD:agent/macro-space-syntax
