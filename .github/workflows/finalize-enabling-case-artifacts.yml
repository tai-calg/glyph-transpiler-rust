name: Finalize Enabling Case Artifacts

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-enabling-case-artifacts.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install verified renderer
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Verify semantics and regenerate README PNG
        run: |
          python -m unittest discover -s tests -p 'test_transition_enabling_cases.py'
          node tests/verify_enabling_case_rendering.mjs
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
          python tests/verify_readme_state_snapshot.py
      - name: Mark design implemented
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('docs/design/transition-enabling-cases-v1.md')
          text = path.read_text(encoding='utf-8')
          if 'Status: Implementing' not in text:
              raise SystemExit('design status is not Implementing')
          path.write_text(text.replace('Status: Implementing', 'Status: Implemented', 1), encoding='utf-8')
          PY
      - name: Commit verified artifacts
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images/glyph-studio-state-transition.png docs/design/transition-enabling-cases-v1.md
          git commit -m "Finalize enabling-case diagram contract"
          git push origin "HEAD:${HEAD_REF}"
