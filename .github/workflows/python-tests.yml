name: Python Test Collection

on:
  pull_request:
    branches: [main]
    paths:
      - "glyph.py"
      - "glyphc.py"
      - "glyph/**"
      - "tests/**/*.py"
      - ".github/workflows/python-tests.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest==8.3.5

      - name: Collect and run every Python test
        run: python -m pytest -q tests