name: Fix child PR function block Action projection

on:
  pull_request:
    branches:
      - agent/transition-action-semantics-v4

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/transition-action-v4-child-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transition-action-semantics-v4
          fetch-depth: 0

      - name: Add function block branch projection
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('glyph/transition_action_projection.py')
          text = path.read_text(encoding='utf-8')
          old = '''    TryExpr,
    TypeRef,
)
'''
          new = '''    TryExpr,
    TypeRef,
    parse_expr,
)
'''
          if old not in text: raise SystemExit('parse_expr import anchor missing')
          text = text.replace(old, new, 1)

          anchor = '''def _warning(message: str, line: int) -> dict[str, object]:
'''
          helpers = '''def _conditional_block_values(
    model: CompilationModel,
    function_name: str | None,
) -> tuple[tuple[int, str, Expr], ...]:
    if function_name is None:
        return ()
    block = next((item for item in model.blocks if item.name == function_name), None)
    if block is None:
        return ()
    values: list[tuple[int, str, Expr]] = []
    for binding in block.bindings:
        if binding.kind != "conditional":
            continue
        for offset, original in enumerate(binding.source.splitlines(), start=1):
            stripped = original.strip()
            arrow = stripped.find("=>")
            if arrow < 0:
                continue
            condition_text = stripped[:arrow].strip()
            value_text = stripped[arrow + 2 :].strip()
            if not value_text:
                continue
            try:
                value = parse_expr(value_text)
                condition = (
                    "otherwise"
                    if condition_text == "_"
                    else render_expr(parse_expr(condition_text))
                )
            except Exception:
                continue
            values.append((binding.line + offset, condition, value))
    return tuple(values)


def _block_value_for_transition(
    values: Sequence[tuple[int, str, Expr]],
    transition: Mapping[str, object],
) -> Expr | None:
    source = transition.get("source", {})
    line = int(source.get("line", 0)) if isinstance(source, Mapping) else 0
    raw = str(transition.get("condition_raw") or transition.get("condition") or "")
    condition = "otherwise" if raw in {"", "otherwise", "next"} else raw
    exact = [
        value
        for candidate_line, candidate_condition, value in values
        if candidate_line == line and candidate_condition == condition
    ]
    if exact:
        return exact[0]
    matching = [
        value
        for _, candidate_condition, value in values
        if candidate_condition == condition
    ]
    return matching[0] if len(matching) == 1 else None


'''
          if anchor not in text: raise SystemExit('block helper insertion anchor missing')
          text = text.replace(anchor, helpers + anchor, 1)

          old = '''    branches = (
        _root_branches(
            next_name,
            functions=functions,
            state_decl=state_decl,
            selector_index=selector_index,
            variants={item.name for item in selector_sum.variants},
            root_state_param=machine.state_param.name,
        )
        if next_name is not None
        else ()
    )

    diagnostics = [dict(item) for item in result.get("diagnostics", [])]
'''
          new = '''    branches = (
        _root_branches(
            next_name,
            functions=functions,
            state_decl=state_decl,
            selector_index=selector_index,
            variants={item.name for item in selector_sum.variants},
            root_state_param=machine.state_param.name,
        )
        if next_name is not None
        else ()
    )
    block_values = _conditional_block_values(model, next_name)

    diagnostics = [dict(item) for item in result.get("diagnostics", [])]
'''
          if old not in text: raise SystemExit('block values initialization anchor missing')
          text = text.replace(old, new, 1)

          old = '''        branch = _branch_for_transition(branches, transition)
        branch_value = getattr(branch, "value", None) if branch is not None else None
        source = transition.get("source", {})
'''
          new = '''        branch = _branch_for_transition(branches, transition)
        branch_value = getattr(branch, "value", None) if branch is not None else None
        if branch_value is None:
            branch_value = _block_value_for_transition(block_values, transition)
        source = transition.get("source", {})
'''
          if old not in text: raise SystemExit('branch fallback anchor missing')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused semantic tests
        id: tests
        run: |
          set +e
          python -m unittest \
            tests.test_machine_action_projection \
            tests.test_transition_action_renderer_contract \
            tests.test_transition_io_clusters \
            tests.test_transition_semantics \
            tests.test_nested_transition_repair \
            tests.test_guard_distinct_failure_repair \
            > transition-v4-block-tests.log 2>&1
          status=$?
          cat transition-v4-block-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit focused failure log
        if: steps.tests.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transition-v4-block-tests.log
          git commit -m "Capture function block Action projection failure"
          git push origin HEAD:agent/transition-action-semantics-v4

      - name: Commit function block projection
        if: steps.tests.outputs.status == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glyph/transition_action_projection.py
          git commit -m "Project Actions from function block results"
          git push origin HEAD:agent/transition-action-semantics-v4
