name: Publish verified README Input Action image

on:
  pull_request:
    branches:
      - agent/revert-invalid-readme-action-image

permissions:
  actions: read
  contents: write

jobs:
  publish:
    if: github.head_ref == 'agent/publish-readme-input-action-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revert-invalid-readme-action-image
          fetch-depth: 0

      - name: Download verified browser artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/input-action-artifact
          mkdir -p /tmp/input-action-artifact
          gh run download 30368098330 \
            --repo tai-calg/glyph-transpiler-rust \
            --name state-diagram-regression \
            --dir /tmp/input-action-artifact

      - name: Validate and install README image
        run: |
          grep -F "verified compiler-derived state diagrams with compact input-arrow-Action labels" \
            /tmp/input-action-artifact/build/state-diagram-regression/verify.log

          cp /tmp/input-action-artifact/build/state-diagram-regression/motor-safety-motor.png \
            docs/images/glyph-studio-state-transition.png

          # The I/O screenshot was not part of this semantic correction. Keep it identical to main.
          git checkout origin/main -- docs/images/glyph-studio-io.png

          python3 - <<'PY'
          from pathlib import Path
          import struct

          image = Path("docs/images/glyph-studio-state-transition.png")
          data = image.read_bytes()
          if data[:8] != b"\x89PNG\r\n\x1a\n":
              raise SystemExit("README state image is not a PNG")
          width, height = struct.unpack(">II", data[16:24])
          if (width, height) != (1800, 1100):
              raise SystemExit(f"unexpected README state image size: {(width, height)}")
          if len(data) < 100_000:
              raise SystemExit(f"README state image is unexpectedly small: {len(data)} bytes")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "Motor Safetyの状態、初期遷移、到達可能・到達不能状態、入力・ガード・遷移結果を一画面へ表示しています。"
          new = "Motor Safetyの実入力条件、ガード、Action、遷移先状態を一画面へ表示しています。遷移ラベルは`Input [Guard] ➞ Action`の形で、状態名とは別に描画されます。"
          if old not in text:
              raise SystemExit("README state-diagram description anchor is missing")
          readme.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Commit verified README image
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md \
            docs/images/glyph-studio-state-transition.png \
            docs/images/glyph-studio-io.png
          git commit -m "Publish verified Input to Action README diagram"
          git push origin HEAD:agent/revert-invalid-readme-action-image
