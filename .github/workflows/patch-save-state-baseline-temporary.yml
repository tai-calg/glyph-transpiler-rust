name: Temporary Save State Baseline Patch

on:
  push:
    branches:
      - agent/macro-space-syntax

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macro-space-syntax
      - name: Preserve baseline geometry outside conflict and narrow modes
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('glyph/diagram_save_controller.py')
          text = path.read_text()
          old = '.glyph-save-state{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;color:var(--muted);border-radius:7px;padding:3px 6px}'
          new = '.glyph-save-state{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:11px;color:var(--muted)}'
          if old not in text:
              raise SystemExit('save state baseline anchor missing')
          text = text.replace(old, new, 1)
          old = '.glyph-save-state[data-persistence="conflict"]{cursor:pointer;outline:1px solid rgba(255,122,139,.38)}'
          new = '.glyph-save-state[data-persistence="conflict"]{cursor:pointer;outline:1px solid rgba(255,122,139,.38);border-radius:7px;padding:3px 6px}'
          if old not in text:
              raise SystemExit('conflict style anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glyph/diagram_save_controller.py
          git commit -m 'Preserve normal save-state layout geometry'
          git push origin HEAD:agent/macro-space-syntax
