name: Refresh Adaptive State Baseline

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/refresh-adaptive-state-baseline.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-state-layout-initial-node'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-state-layout-initial-node
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Download compiler-derived state rendering
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/adaptive-state-baseline
          mkdir -p /tmp/adaptive-state-baseline
          gh run download 30743156966 \
            --repo tai-calg/glyph-transpiler-rust \
            --name state-diagram-regression \
            --dir /tmp/adaptive-state-baseline
          test -f /tmp/adaptive-state-baseline/build/state-diagram-regression/motor-safety-motor.png
          cp /tmp/adaptive-state-baseline/build/state-diagram-regression/motor-safety-motor.png \
            docs/images/glyph-studio-state-transition.png
      - name: Commit refreshed baseline
        run: |
          set -euo pipefail
          git add docs/images/glyph-studio-state-transition.png
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Refresh README state diagram for adaptive layout"
          git push origin HEAD:agent/adaptive-state-layout-initial-node
