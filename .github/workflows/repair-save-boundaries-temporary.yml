name: Temporary Save Boundary Repair

on:
  push:
    branches:
      - agent/macro-space-syntax
    paths:
      - .repair-save-boundaries-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macro-space-syntax
      - name: Apply final save-boundary repairs
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('glyph/diagram_app.py')
          text = app.read_text()
          old = '''            while len(self._save_operation_order) > _MAX_SAVE_OPERATIONS:
                expired = self._save_operation_order.pop(0)
                self._save_operations.pop(expired, None)
          '''
          new = '''            while len(self._save_operation_order) > _MAX_SAVE_OPERATIONS:
                expired_index = next(
                    (
                        index
                        for index, request_id in enumerate(self._save_operation_order)
                        if self._save_operations[request_id].status != "saving"
                    ),
                    None,
                )
                if expired_index is None:
                    break
                expired = self._save_operation_order.pop(expired_index)
                self._save_operations.pop(expired, None)
          '''
          if old not in text:
              raise SystemExit('save operation pruning anchor missing')
          text = text.replace(old, new, 1)
          old = '''                self.end_headers()
                self.wfile.write(payload)
          '''
          new = '''                self.end_headers()
                try:
                    self.wfile.write(payload)
                except (BrokenPipeError, ConnectionResetError):
                    pass
          '''
          if old not in text:
              raise SystemExit('diagram json response anchor missing')
          app.write_text(text.replace(old, new, 1))

          desktop = Path('glyph/desktop_server.py')
          text = desktop.read_text()
          old = '''            self.end_headers()
            self.wfile.write(payload)
          '''
          new = '''            self.end_headers()
            try:
                self.wfile.write(payload)
            except (BrokenPipeError, ConnectionResetError):
                pass
          '''
          if old not in text:
              raise SystemExit('desktop json response anchor missing')
          desktop.write_text(text.replace(old, new, 1))

          controller = Path('glyph/diagram_save_controller.py')
          text = controller.read_text()
          old = '''  button.disabled=saveInFlight;
  button.title=t("saveTitle");
          '''
          new = '''  button.disabled=false;
  button.dataset.savePending=saveInFlight?"true":"false";
  button.title=t("saveTitle");
          '''
          if old not in text:
              raise SystemExit('save button pending anchor missing')
          controller.write_text(text.replace(old, new, 1))
          PY
      - name: Verify syntax
        run: |
          python -m py_compile glyph/diagram_app.py glyph/desktop_server.py glyph/diagram_save_controller.py
      - name: Commit repairs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glyph/diagram_app.py glyph/desktop_server.py glyph/diagram_save_controller.py
          git commit -m 'Close remaining tracked-save failure boundaries'
          git push origin HEAD:agent/macro-space-syntax
