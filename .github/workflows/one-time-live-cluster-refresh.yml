name: One-time Live Cluster Refresh

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-live-cluster-refresh.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/system-action-control-flow-completeness-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make cluster refresh live and awaitable
        run: |
          python - <<'PY'
          from pathlib import Path

          clusters = Path("glyph/transition_io_clusters.py")
          source = clusters.read_text(encoding="utf-8")
          old = 'async function state(){if(cache)return cache;const response=await fetch("/api/state",{cache:"no-store"});if(!response.ok)throw Error("diagram state unavailable");return cache=await response.json()}'
          new = 'async function state(){const live=typeof snapshot==="object"&&snapshot?snapshot:null;if(live)return live;if(cache)return cache;const response=await fetch("/api/state",{cache:"no-store"});if(!response.ok)throw Error("diagram state unavailable");return cache=await response.json()}'
          if source.count(old) != 1:
              raise SystemExit(f"cluster state block count={source.count(old)}")
          source = source.replace(old, new)

          old = 'patchExports();patchReroute();window.glyphTransitionIoClusters={render:()=>schedule(null,0),maxDistance:MAX_DISTANCE};schedule(null,0);'
          new = 'patchExports();patchReroute();window.glyphTransitionIoClusters={render:async()=>{cache=null;for(let attempt=0;attempt<100&&running;attempt+=1)await new Promise(resolve=>setTimeout(resolve,10));if(running)throw Error("transition I/O renderer did not become idle");return render()},maxDistance:MAX_DISTANCE,version:2};schedule(null,0);'
          if source.count(old) != 1:
              raise SystemExit(f"cluster public API block count={source.count(old)}")
          clusters.write_text(source.replace(old, new), encoding="utf-8")

          transaction = Path("glyph/transition_layout_transaction.py")
          source = transaction.read_text(encoding="utf-8")
          old = '  internalClusterRefresh=true;\n  try{window.glyphTransitionIoClusters?.render()}finally{internalClusterRefresh=false}\n  await nextFrame();'
          new = '  internalClusterRefresh=true;\n  try{await window.glyphTransitionIoClusters?.render?.()}finally{internalClusterRefresh=false}\n  await nextFrame();'
          if source.count(old) != 1:
              raise SystemExit(f"transaction refresh block count={source.count(old)}")
          transaction.write_text(source.replace(old, new), encoding="utf-8")

          test = Path("tests/test_transition_layout_transaction.py")
          source = test.read_text(encoding="utf-8")
          anchor = '    assert "window.glyphDiagramViewport?.fitInitial?.()" in html\n'
          addition = '    assert "await window.glyphTransitionIoClusters?.render?.()" in html\n'
          if source.count(anchor) != 1:
              raise SystemExit(f"test anchor count={source.count(anchor)}")
          test.write_text(source.replace(anchor, anchor + addition), encoding="utf-8")
          PY
          python -m py_compile glyph/transition_io_clusters.py glyph/transition_layout_transaction.py tests/test_transition_layout_transaction.py
          python - <<'PY'
          from pathlib import Path
          items = [
              ("glyph/transition_io_clusters.py", "glyph-transition-io-clusters-v1-script", "/tmp/clusters.js"),
              ("glyph/transition_layout_transaction.py", "glyph-transition-layout-transaction-v1-script", "/tmp/transaction.js"),
          ]
          for source_path, script_id, target in items:
              source = Path(source_path).read_text(encoding="utf-8")
              marker = f'<script id="{script_id}">'
              start = source.index(marker) + len(marker)
              end = source.index('</script>', start)
              Path(target).write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/clusters.js
          node --check /tmp/transaction.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/transition_io_clusters.py glyph/transition_layout_transaction.py tests/test_transition_layout_transaction.py
          git commit -m "Refresh transition clusters from live preview state"
          git push origin "HEAD:${{ github.head_ref }}"
