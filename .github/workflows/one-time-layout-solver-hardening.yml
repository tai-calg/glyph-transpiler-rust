name: One-time Layout Solver Hardening

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-layout-solver-hardening.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/system-action-control-flow-completeness-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Patch bounded dense-layout solver
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("glyph/transition_layout_transaction.py")
          source = path.read_text(encoding="utf-8")

          replacements = [
              (
                  'const LABEL_MIN_WIDTH=108,LABEL_MAX_WIDTH=520,LABEL_RETRY_WIDTH=360;',
                  'const LABEL_MIN_WIDTH=108,LABEL_MAX_WIDTH=520,LABEL_RETRY_WIDTH=320,LABEL_LAST_WIDTH=240;',
              ),
              (
                  'const OPTION_LIMIT=160,SEARCH_STEPS=220000,SEARCH_BUDGET_MS=180;',
                  'const OPTION_LIMIT=160,SEARCH_STEPS=220000,SEARCH_BUDGET_MS=450;',
              ),
              (
                  '''  return clusters.map((cluster,index)=>{\n    const id=cluster.dataset.transitionId||`T${index+1}`,fraction=fractions.get(index)??.5,anchor=anchorFor(stage,id,index,fraction),record=saved[id];\n    const manual=Boolean(record);\n    const restored=finite(record?.dx)&&finite(record?.dy)\n      ?{x:anchor.x+record.dx,y:anchor.y+record.dy}\n      :finite(record?.x)&&finite(record?.y)?{x:record.x,y:record.y}\n      :{x:num(cluster.style.left)||anchor.x,y:num(cluster.style.top)||anchor.y};\n    const entry={cluster,index,id,anchor,manual,preferred:project(restored,anchor),options:[]};\n    entry.options=optionsFor(entry,stage,nodes,pathSamples);\n    return entry;\n  });\n}\nfunction entryOrder(entries){\n  return[...entries].sort((left,right)=>Number(right.manual)-Number(left.manual)||left.options.length-right.options.length||left.index-right.index);\n}\n''',
                  '''  const entries=clusters.map((cluster,index)=>{\n    const id=cluster.dataset.transitionId||`T${index+1}`,fraction=fractions.get(index)??.5,anchor=anchorFor(stage,id,index,fraction),record=saved[id];\n    const manual=Boolean(record);\n    const restored=finite(record?.dx)&&finite(record?.dy)\n      ?{x:anchor.x+record.dx,y:anchor.y+record.dy}\n      :finite(record?.x)&&finite(record?.y)?{x:record.x,y:record.y}\n      :{x:num(cluster.style.left)||anchor.x,y:num(cluster.style.top)||anchor.y};\n    const entry={cluster,index,id,anchor,manual,preferred:project(restored,anchor),options:[],congestion:0};\n    entry.options=optionsFor(entry,stage,nodes,pathSamples);\n    return entry;\n  });\n  entries.forEach(entry=>{\n    entry.congestion=entries.reduce((count,other)=>count+(other!==entry&&Math.hypot(entry.anchor.x-other.anchor.x,entry.anchor.y-other.anchor.y)<220?1:0),0);\n  });\n  return entries;\n}\nfunction entryOrder(entries){\n  return[...entries].sort((left,right)=>Number(right.manual)-Number(left.manual)||right.congestion-left.congestion||left.options.length-right.options.length||left.index-right.index);\n}\n''',
              ),
              (
                  '''function solveEntries(entries,token){\n  const ordered=entryOrder(entries),assignment=new Map(),placed=[];\n  const deadline=performance.now()+SEARCH_BUDGET_MS;\n  let steps=0,timedOut=false;\n  function hasFutureOption(start){\n    for(let index=start;index<ordered.length;index+=1){\n      if(!ordered[index].options.some(option=>!placed.some(rect=>intersects(option.rect,rect))))return false;\n    }\n    return true;\n  }\n  function visit(index){\n    if(index>=ordered.length)return true;\n    steps+=1;\n    if(steps>SEARCH_STEPS||performance.now()>deadline||cancelled(token)){timedOut=true;return false}\n    const entry=ordered[index];\n    for(const option of entry.options){\n      if(placed.some(rect=>intersects(option.rect,rect)))continue;\n      assignment.set(entry.cluster,option);placed.push(option.rect);\n      if(hasFutureOption(index+1)&&visit(index+1))return true;\n      placed.pop();assignment.delete(entry.cluster);\n      if(timedOut)return false;\n    }\n    return false;\n  }\n  return{assignment:visit(0)?assignment:null,steps,timedOut};\n}\n''',
                  '''function solveEntries(entries,token){\n  const ordered=entryOrder(entries),assignment=new Map(),placed=[],remaining=new Set(ordered);\n  const deadline=performance.now()+SEARCH_BUDGET_MS;\n  let steps=0,timedOut=false;\n  function visit(){\n    if(!remaining.size)return true;\n    steps+=1;\n    if(steps>SEARCH_STEPS||performance.now()>deadline||cancelled(token)){timedOut=true;return false}\n    let selected=null,viable=null;\n    for(const entry of remaining){\n      const options=entry.options.filter(option=>!placed.some(rect=>intersects(option.rect,rect)));\n      if(!options.length)return false;\n      if(!viable||options.length<viable.length||(options.length===viable.length&&entry.congestion>(selected?.congestion||0))){selected=entry;viable=options}\n    }\n    remaining.delete(selected);\n    for(const option of viable){\n      assignment.set(selected.cluster,option);placed.push(option.rect);\n      if(visit())return true;\n      placed.pop();assignment.delete(selected.cluster);\n      if(timedOut)break;\n    }\n    remaining.add(selected);\n    return false;\n  }\n  return{assignment:visit()?assignment:null,steps,timedOut};\n}\n''',
              ),
              (
                  '''  const attempts=[\n    {maxLineWidth:LABEL_MAX_WIDTH,growth:1},\n    {maxLineWidth:LABEL_RETRY_WIDTH,growth:1.18},\n  ];\n''',
                  '''  const attempts=[\n    {maxLineWidth:LABEL_MAX_WIDTH,growth:1},\n    {maxLineWidth:LABEL_RETRY_WIDTH,growth:1.18},\n    {maxLineWidth:LABEL_LAST_WIDTH,growth:1.32},\n  ];\n''',
              ),
              (
                  '''    formatLabels(stage,strategy.maxLineWidth);\n    ensureCanvas(stage,machine.transitions?.length||0,{growth:strategy.growth,includeLabels:true});\n    reroute(stage,machine);\n''',
                  '''    formatLabels(stage,strategy.maxLineWidth);\n    const dense=ensureCanvas(stage,machine.transitions?.length||0,{growth:strategy.growth,includeLabels:true});\n    arrangeInitialDenseNodes(stage,data,machine,dense);\n    reroute(stage,machine);\n''',
              ),
          ]

          for old, new in replacements:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement, found {count}: {old[:80]!r}")
              source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")

          test_path = Path("tests/test_transition_layout_transaction.py")
          test_source = test_path.read_text(encoding="utf-8")
          old_test = 'assert "SEARCH_BUDGET_MS=180" in html'
          new_test = 'assert "SEARCH_BUDGET_MS=450" in html'
          if test_source.count(old_test) != 1:
              raise SystemExit("layout budget assertion was not found exactly once")
          test_path.write_text(test_source.replace(old_test, new_test), encoding="utf-8")
          PY
          python -m py_compile glyph/transition_layout_transaction.py tests/test_transition_layout_transaction.py
          python - <<'PY'
          from pathlib import Path
          source = Path("glyph/transition_layout_transaction.py").read_text(encoding="utf-8")
          start = source.index('<script id="glyph-transition-layout-transaction-v1-script">') + len('<script id="glyph-transition-layout-transaction-v1-script">')
          end = source.index('</script>', start)
          Path('/tmp/transition-layout.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/transition-layout.js
      - name: Commit solver hardening to PR branch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          git fetch origin "$HEAD_REF"
          git checkout -B "$HEAD_REF" FETCH_HEAD
          git checkout -- glyph/transition_layout_transaction.py tests/test_transition_layout_transaction.py
          # Re-apply the verified worktree patch after checking out the writable branch.
          git apply <(git diff --binary HEAD@{1} -- glyph/transition_layout_transaction.py tests/test_transition_layout_transaction.py) || true
          # The previous checkout can clear the worktree diff on some runners; patch directly when needed.
          if ! grep -q 'SEARCH_BUDGET_MS=450' glyph/transition_layout_transaction.py; then
            python - <<'PY'
          from pathlib import Path
          path = Path('glyph/transition_layout_transaction.py')
          source = path.read_text()
          source = source.replace('const LABEL_MIN_WIDTH=108,LABEL_MAX_WIDTH=520,LABEL_RETRY_WIDTH=360;', 'const LABEL_MIN_WIDTH=108,LABEL_MAX_WIDTH=520,LABEL_RETRY_WIDTH=320,LABEL_LAST_WIDTH=240;')
          source = source.replace('const OPTION_LIMIT=160,SEARCH_STEPS=220000,SEARCH_BUDGET_MS=180;', 'const OPTION_LIMIT=160,SEARCH_STEPS=220000,SEARCH_BUDGET_MS=450;')
          raise SystemExit('worktree patch was lost before commit; refusing an unverified partial patch')
          PY
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/transition_layout_transaction.py tests/test_transition_layout_transaction.py
          git commit -m "Harden dense transition layout solver"
          git push origin "HEAD:$HEAD_REF"
