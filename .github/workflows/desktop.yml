name: Desktop

on:
  pull_request:
    paths:
      - "desktop/**"
      - "glyph/desktop_server.py"
      - "glyph/manual_layout_semantic_guard.py"
      - "glyph/node_drag_publication_guard.py"
      - "glyph/readable_diagram_app.py"
      - "glyph/transition_node_position_adapter.py"
      - "tests/test_desktop_server.py"
      - "tests/test_manual_layout_semantic_guard.py"
      - "tests/test_node_drag_publication_guard.py"
      - "tests/test_tauri_desktop.py"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - "glyph/desktop_server.py"
      - "glyph/manual_layout_semantic_guard.py"
      - "glyph/node_drag_publication_guard.py"
      - "glyph/readable_diagram_app.py"
      - "glyph/transition_node_position_adapter.py"
      - "tests/test_desktop_server.py"
      - "tests/test_manual_layout_semantic_guard.py"
      - "tests/test_node_drag_publication_guard.py"
      - "tests/test_tauri_desktop.py"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"

jobs:
  linux-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev
      - name: Install Python and frontend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[desktop]'
          npm install --prefix desktop
      - name: Generate Tauri icon assets
        run: |
          npm run --prefix desktop icons
          test -s desktop/src-tauri/icons/icon.png
          test -s desktop/src-tauri/icons/icon.ico
          test -s desktop/src-tauri/icons/icon.icns
      - name: Run desktop Python contracts
        run: python -m unittest tests.test_desktop_server tests.test_tauri_desktop -v
      - name: Build trusted frontend
        run: npm run --prefix desktop build:web
      - name: Build and smoke-test Python sidecar
        run: |
          python desktop/scripts/build_sidecar.py
          sidecar=$(find desktop/src-tauri/binaries -maxdepth 1 -type f | head -n 1)
          test -n "$sidecar"
          "$sidecar" --help
      - name: Check Tauri Rust shell
        run: cargo check --manifest-path desktop/src-tauri/Cargo.toml
      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
