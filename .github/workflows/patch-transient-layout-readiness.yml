name: Patch Transient Layout Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-transient-layout-readiness.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Treat missing initial clusters as retryable
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('glyph/transition_layout_transaction.py')
          text = path.read_text(encoding='utf-8')
          old = 'if(!await ensureClusters(stage,machine,token))throw Error("transition clusters were not created");'
          new = 'if(!await ensureClusters(stage,machine,token))return false;'
          if old not in text:
              raise SystemExit('cluster readiness branch changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit readiness fix
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/transition_layout_transaction.py
          git commit -m "Retry transient transition cluster readiness"
          git push origin "HEAD:${HEAD_REF}"
