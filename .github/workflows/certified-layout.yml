name: Certified Incremental Layout

on:
  pull_request:
    branches: [main]
    paths:
      - "glyph/diagram_fit_stability.py"
      - "glyph/diagram_geometry_kernel.py"
      - "glyph/diagram_rendered_geometry_adapter.py"
      - "glyph/initial_transition_dependency_bridge.py"
      - "glyph/initial_transition_layout.py"
      - "glyph/layout_compact_shelf_repair.py"
      - "glyph/layout_corridor_fast_repair.py"
      - "glyph/layout_corridor_repair.py"
      - "glyph/layout_dependency_bridge.py"
      - "glyph/layout_local_repair.py"
      - "glyph/layout_publication_certificate.py"
      - "glyph/layout_shelf_repair.py"
      - "glyph/layout_shelf_viewport_sync.py"
      - "glyph/readable_diagram_app.py"
      - "glyph/state_viewport_reservation.py"
      - "glyph/transition_layout_transaction.py"
      - "tests/test_diagram_fit_stability.py"
      - "tests/test_diagram_geometry_kernel.py"
      - "tests/test_initial_transition_dependency_bridge.py"
      - "tests/test_initial_transition_layout.py"
      - "tests/test_layout_compact_shelf_repair.py"
      - "tests/test_layout_corridor_fast_repair.py"
      - "tests/test_layout_corridor_repair.py"
      - "tests/test_layout_dependency_bridge.py"
      - "tests/test_layout_generation_protocol.py"
      - "tests/test_layout_local_repair.py"
      - "tests/test_layout_publication_certificate.py"
      - "tests/test_layout_shelf_repair.py"
      - "tests/test_layout_shelf_viewport_sync.py"
      - "tests/test_state_viewport_reservation.py"
      - "tests/test_transition_layout_transaction.py"
      - "tests/verify_certified_layout_performance.mjs"
      - "tests/verify_readme_state_snapshot.py"
      - "tests/verify_state_diagram_rendering.mjs"
      - "docs/images/glyph-studio-state-transition.png"
      - "examples/acceptance/motor_safety.glyph"
      - "examples/state_diagrams/conveyor_control.glyph"
      - "examples/state_diagrams/dual_machines.glyph"
      - "examples/state_diagrams/session_protocol.glyph"
      - "examples/state_diagrams/traffic_light.glyph"
      - "docs/design/certified-incremental-layout-v1.md"
      - ".github/workflows/certified-layout.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser and image verifier
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Verify geometry contracts
        run: |
          python -m unittest tests.test_diagram_fit_stability
          python -m unittest tests.test_diagram_geometry_kernel
          python -m unittest tests.test_initial_transition_dependency_bridge
          python -m unittest tests.test_initial_transition_layout
          python -m unittest discover -s tests -p 'test_layout_*.py'
          python -m unittest tests.test_state_viewport_reservation
          python -m unittest tests.test_transition_layout_transaction

      - name: Verify responsiveness and certificate reuse
        run: |
          timeout 180s node tests/verify_certified_layout_performance.mjs

      - name: Verify publication rendering and README baseline
        run: |
          timeout 180s node tests/verify_state_diagram_rendering.mjs
          python tests/verify_readme_state_snapshot.py
