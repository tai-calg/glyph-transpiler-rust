name: README Assembly doc once

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing
    paths:
      - .github/workflows/readme-assembly-doc-once.yml

permissions:
  contents: write

jobs:
  patch-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
      - name: Patch README Assembly syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('README.md')
          text = path.read_text()

          text = text.replace(
              '11. [状態機械](#11-状態機械)\n12. [時間制約](#12-時間制約)',
              '11. [状態機械](#11-状態機械)\n12. [Machine Assembly](#12-machine-assembly)\n13. [時間制約](#13-時間制約)',
          )
          for old, new in [
              ('13. [マクロ](#13-マクロ)', '14. [マクロ](#14-マクロ)'),
              ('14. [CapabilityとResource](#14-capabilityとresource)', '15. [CapabilityとResource](#15-capabilityとresource)'),
              ('15. [Contract](#15-contract)', '16. [Contract](#16-contract)'),
              ('16. [理論的基盤と保証範囲](#16-理論的基盤と保証範囲)', '17. [理論的基盤と保証範囲](#17-理論的基盤と保証範囲)'),
              ('17. [生成物](#17-生成物)', '18. [生成物](#18-生成物)'),
              ('18. [Glyph Studioの操作](#18-glyph-studioの操作)', '19. [Glyph Studioの操作](#19-glyph-studioの操作)'),
              ('19. [よくある間違い](#19-よくある間違い)', '20. [よくある間違い](#20-よくある間違い)'),
              ('20. [開発とテスト](#20-開発とテスト)', '21. [開発とテスト](#21-開発とテスト)'),
              ('21. [文書一覧](#21-文書一覧)', '22. [文書一覧](#22-文書一覧)'),
              ('22. [ライセンス](#22-ライセンス)', '23. [ライセンス](#23-ライセンス)'),
          ]:
              text = text.replace(old, new)

          text = text.replace(
              '**SystemとMachine**で、処理全体と状態遷移の境界を定義する',
              '**SystemとMachine**で、処理全体と状態遷移の境界を定義し、必要なら**Assembly**でMachine同士を接続する',
          )
          text = text.replace(
              '`system`、`machine`まで理解すれば、基本的な設計を記述できます。',
              '`system`、`machine`、`assembly`まで理解すれば、基本的な設計を記述できます。',
          )
          table_old = '| 10 | `machine Name(...)` | 状態機械 | 初期状態と次状態計算を宣言する | 通常の関数変換と状態遷移を区別するため |\n| 11 | `?name(...)=...` | 時間制約'
          table_new = '| 10 | `machine Name(...)` | 状態機械 | 初期状態と次状態計算を宣言する | 通常の関数変換と状態遷移を区別するため |\n| 11 | `assembly Name` | Machine Assembly | Machine instanceを名前付きで配置し、既存の`!`作用を別Machineの入力へ接続する | 独立した状態機械を明示的な型付き経路で合成するため |\n| 12 | `?name(...)=...` | 時間制約'
          if table_old not in text:
              raise SystemExit('syntax table anchor not found')
          text = text.replace(table_old, table_new, 1)
          for old, new in [
              ('| 12 | `resource Name[...]`', '| 13 | `resource Name[...]`'),
              ('| 13 | `\'...`', '| 14 | `\'...`'),
              ('| 14 | `@NAME=...` / `@name(x)=...`', '| 15 | `@NAME=...` / `@name(x)=...`'),
              ('| 15 | `=Name=Type`', '| 16 | `=Name=Type`'),
              ('| 16 | `~name(...)`', '| 17 | `~name(...)`'),
          ]:
              text = text.replace(old, new, 1)

          anchor = '''`machine`が存在しない場合、型名や関数名から状態機械を推測しません。\n\n---\n\n## 12. 時間制約'''
          section = '''`machine`が存在しない場合、型名や関数名から状態機械を推測しません。\n\n---\n\n## 12. Machine Assembly\n\n`assembly`は、既存の`machine`を**名前付きinstanceとして配置し、あるMachineの`!`作用を別Machineの入力へ接続する**ための構文です。Machine本体へ専用の送信構文を追加せず、既存の入力と`!`作用をそのまま再利用します。\n\n```glyph\nassembly DoorControl\n  door=Door\n  safety=Safety\n  motor=Motor\n\n  door.notify_safety -> safety.input\n  safety.request_motor -> motor.input\n```\n\nこの例では、`door`、`safety`、`motor`がそれぞれMachine instanceです。`door.notify_safety -> safety.input`は、`door`内で実行された既存の`!notify_safety(...)`のpayloadを、`safety`の既存入力`input`へ渡します。\n\nv1の基本規則:\n\n- `instance=Machine`でMachine instanceへ名前を付ける\n- `source.effect -> target.input`でMachine間routeを宣言する\n- 接続された`!`はHostへ出ず、宣言位置でtarget Machineへ**即時・depth-first**に配送される\n- source Machineの反応はtarget Machineの反応が完了するまでそのcall pointで中断し、その後sourceへ戻る\n- 接続されていない`!`は従来どおりHost向けの外部作用として扱う\n- v1の内部routeはpayload引数1個、戻り値`()`のone-way operationに限定する\n- 暗黙queue、broadcast、whole-Assembly同期cycleは導入しない\n\n接続される作用は、たとえば次のように既存の`!`宣言として書きます。\n\n```glyph\n!notify_safety(event:SafetyInput):()\n```\n\nAssembly全体のtop-level causal reactionが成功した場合だけ、各instanceの次状態をまとめてcommitします。途中のMachine、route、Host、型検証などが失敗した場合、Machine stateはtop-level reaction開始前の状態へrollbackします。ただし、すでに実行されたHost側の外部作用そのものは取り消せません。\n\n> 現在、Assemblyの解析、型検証、Studio/図/JSON出力、Python reference runtimeは利用できますが、Machine instanceを考慮したRust loweringは未実装です。Assemblyを含むRustコード生成は誤ったコードを出さずfail-closedします。\n\n詳細仕様は[`docs/machine-assembly.md`](docs/machine-assembly.md)を参照してください。実例は[`examples/machine_assembly_immediate.glyph`](examples/machine_assembly_immediate.glyph)にあります。\n\n---\n\n## 13. 時間制約'''
          if anchor not in text:
              raise SystemExit('machine section anchor not found')
          text = text.replace(anchor, section, 1)

          for old, new in [
              ('## 13. マクロ', '## 14. マクロ'),
              ('## 14. CapabilityとResource', '## 15. CapabilityとResource'),
              ('## 15. Contract', '## 16. Contract'),
              ('## 16. 理論的基盤と保証範囲', '## 17. 理論的基盤と保証範囲'),
              ('### 16.1 ', '### 17.1 '),
              ('### 16.2 ', '### 17.2 '),
              ('### 16.3 ', '### 17.3 '),
              ('### 16.4 ', '### 17.4 '),
              ('### 16.5 ', '### 17.5 '),
              ('### 16.6 ', '### 17.6 '),
              ('## 17. 生成物', '## 18. 生成物'),
              ('## 18. Glyph Studioの操作', '## 19. Glyph Studioの操作'),
              ('## 19. よくある間違い', '## 20. よくある間違い'),
              ('## 20. 開発とテスト', '## 21. 開発とテスト'),
              ('## 21. 文書一覧', '## 22. 文書一覧'),
              ('## 22. ライセンス', '## 23. ライセンス'),
          ]:
              text = text.replace(old, new)

          docs_old = '| 言語仕様全体 | [`docs/LANGUAGE.md`](docs/LANGUAGE.md) |\n| 時間制約 |'
          docs_new = '| 言語仕様全体 | [`docs/LANGUAGE.md`](docs/LANGUAGE.md) |\n| Machine Assembly | [`docs/machine-assembly.md`](docs/machine-assembly.md) |\n| 時間制約 |'
          if docs_old not in text:
              raise SystemExit('docs table anchor not found')
          text = text.replace(docs_old, docs_new, 1)

          path.write_text(text)
          PY
      - name: Commit README
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git diff -- README.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md
          git commit -m "Document Machine Assembly syntax in README"
          git push origin HEAD:agent/machine-assembly-immediate-routing
