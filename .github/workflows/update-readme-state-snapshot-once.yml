name: Update README State Snapshot Once

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/update-readme-state-snapshot-once.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate expanded state snapshot
        run: |
          set -euo pipefail
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
      - name: Commit generated snapshot and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-readme-state-snapshot-once.yml
          git add docs/images/glyph-studio-state-transition.png
          git commit -m "Refresh expanded state diagram snapshot"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
