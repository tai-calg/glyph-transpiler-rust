name: Update README State Snapshot Once

on:
  push:
    branches:
      - agent/system-action-control-flow-completeness-v2
    paths:
      - ".github/workflows/update-readme-state-snapshot-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generate and normalize ordinary state snapshot
        run: |
          set -euo pipefail
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
      - name: Commit normalized snapshot and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-readme-state-snapshot-once.yml
          git add docs/images/glyph-studio-state-transition.png
          git commit -m "Normalize ordinary state diagram snapshot"
          git push origin "HEAD:${GITHUB_REF_NAME}"
