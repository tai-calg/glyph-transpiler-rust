name: Temporary Async Save Patch

on:
  push:
    branches:
      - agent/macro-space-syntax

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macro-space-syntax
      - name: Apply asynchronous save and compile worker
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          app_path = Path('glyph/diagram_app.py')
          text = app_path.read_text()
          text = text.replace('import hashlib\n', 'import errno\nimport hashlib\n', 1)
          text = text.replace('import threading\n', 'import threading\nimport uuid\n', 1)

          conflict_block = '''class SaveConflictError(RuntimeError):
              """The source changed on disk after the editor loaded it."""

              def __init__(self, current_source: str, current_digest: str):
                  super().__init__("source file changed outside Glyph Studio")
                  self.current_source = current_source
                  self.current_digest = current_digest
          '''
          replacement = conflict_block + '''

          class SaveWriteError(RuntimeError):
              """The source could not be persisted before compilation."""

              def __init__(
                  self,
                  code: str,
                  message: str,
                  status: HTTPStatus = HTTPStatus.INTERNAL_SERVER_ERROR,
              ):
                  super().__init__(message)
                  self.code = code
                  self.status = status


          @dataclass(frozen=True)
          class CompileRequest:
              operation_id: str
              source: str
              digest: str
          '''
          if conflict_block not in text:
              raise SystemExit('SaveConflictError anchor missing')
          text = text.replace(conflict_block, replacement, 1)

          text = text.replace(
              '    last_successful_version: int\n    updated_at: str\n',
              '    last_successful_version: int\n    operation_id: str | None\n    updated_at: str\n',
              1,
          )
          text = text.replace(
              '            "last_successful_version": self.last_successful_version,\n            "updated_at": self.updated_at,',
              '            "last_successful_version": self.last_successful_version,\n            "operation_id": self.operation_id,\n            "updated_at": self.updated_at,',
              1,
          )
          text = text.replace(
              '        self._operation_lock = threading.RLock()\n',
              '        self._compile_lock = threading.RLock()\n'
              '        self._save_lock = threading.RLock()\n'
              '        self._compile_condition = threading.Condition()\n'
              '        self._pending_compile: CompileRequest | None = None\n'
              '        self._compile_worker: threading.Thread | None = None\n',
              1,
          )
          text = text.replace(
              '            last_successful_version=0,\n            updated_at=',
              '            last_successful_version=0,\n            operation_id=None,\n            updated_at=',
              1,
          )
          text = text.replace('        with self._operation_lock:\n', '        with self._compile_lock:\n', 1)
          text = text.replace(
              '                    last_successful_version=version,\n                    updated_at=',
              '                    last_successful_version=version,\n                    operation_id=None,\n                    updated_at=',
              1,
          )
          text = text.replace(
              '                    last_successful_version=previous.last_successful_version,\n                    updated_at=',
              '                    last_successful_version=previous.last_successful_version,\n                    operation_id=None,\n                    updated_at=',
              1,
          )

          save_pattern = re.compile(
              r'    def save_source\(\n.*?\n    def start_watching\(',
              re.DOTALL,
          )
          save_replacement = '''    def _read_disk_source(self) -> str:
              try:
                  return self.input_path.read_text(encoding="utf-8")
              except FileNotFoundError:
                  return ""
              except PermissionError as exc:
                  raise SaveWriteError(
                      "source_read_permission_denied",
                      str(exc),
                      HTTPStatus.FORBIDDEN,
                  ) from exc
              except OSError as exc:
                  raise SaveWriteError("source_read_failed", str(exc)) from exc

              def _persist_source(
                  self,
                  source: str,
                  *,
                  base_digest: str | None,
              ) -> str:
                  current_source = self._read_disk_source()
                  current_digest = _digest(current_source)
                  if base_digest is not None and current_digest != base_digest:
                      raise SaveConflictError(current_source, current_digest)
                  try:
                      _atomic_write(self.input_path, source)
                  except PermissionError as exc:
                      raise SaveWriteError(
                          "save_permission_denied",
                          str(exc),
                          HTTPStatus.FORBIDDEN,
                      ) from exc
                  except OSError as exc:
                      if exc.errno == errno.ENOSPC:
                          raise SaveWriteError(
                              "save_no_space",
                              str(exc),
                              HTTPStatus.INSUFFICIENT_STORAGE,
                          ) from exc
                      raise SaveWriteError("save_io_error", str(exc)) from exc
                  return _digest(source)

              def _publish_compiling(
                  self,
                  source: str,
                  source_digest: str,
                  operation_id: str,
              ) -> DiagramSnapshot:
                  with self._lock:
                      previous = self._snapshot
                      snapshot = DiagramSnapshot(
                          version=previous.version + 1,
                          status="compiling",
                          source=source,
                          digest=source_digest,
                          rendered_digest=previous.rendered_digest,
                          last_successful_version=previous.last_successful_version,
                          operation_id=operation_id,
                          updated_at=_utc_now(),
                          diagnostics=(),
                          views=previous.views,
                      )
                      self._snapshot = snapshot
                      return snapshot

              def _ensure_compile_worker(self) -> None:
                  with self._compile_condition:
                      if self._compile_worker is not None and self._compile_worker.is_alive():
                          return
                      self._compile_worker = threading.Thread(
                          target=self._compile_loop,
                          name="glyph-diagram-compile",
                          daemon=True,
                      )
                      self._compile_worker.start()

              def _queue_compile(self, request: CompileRequest) -> None:
                  self._ensure_compile_worker()
                  with self._compile_condition:
                      self._pending_compile = request
                      self._compile_condition.notify_all()

              def _compile_loop(self) -> None:
                  while True:
                      with self._compile_condition:
                          while self._pending_compile is None and not self._stop.is_set():
                              self._compile_condition.wait(timeout=0.5)
                          if self._stop.is_set():
                              return
                          request = self._pending_compile
                          self._pending_compile = None
                      assert request is not None
                      self._compile_request(request)

              def _compile_request(self, request: CompileRequest) -> None:
                  diagnostics: tuple[dict[str, object], ...] = ()
                  views: dict[str, object] | None = None
                  try:
                      with self._compile_lock:
                          result = self.compiler.compile_text(
                              request.source,
                              source_name=str(self.input_path),
                              source_href=str(self.input_path),
                          )
                          compilation = result.snapshot
                          views = self.view_builder(
                              compilation.model,
                              compilation.diagrams.ir,
                          )
                  except (GlyphError, OSError, ValueError) as exc:
                      diagnostics = ({"severity": "error", "message": str(exc)},)

                  with self._lock:
                      current = self._snapshot
                      if current.operation_id != request.operation_id:
                          return
                      version = current.version + 1
                      if views is not None:
                          try:
                              _atomic_write(
                                  self.output_path,
                                  json.dumps(views, ensure_ascii=False, indent=2) + "\\n",
                              )
                          except OSError as exc:
                              views = None
                              diagnostics = (
                                  {
                                      "severity": "error",
                                      "message": f"artifact_write_failed: {exc}",
                                  },
                              )
                      if views is not None:
                          self._snapshot = DiagramSnapshot(
                              version=version,
                              status="ready",
                              source=request.source,
                              digest=request.digest,
                              rendered_digest=request.digest,
                              last_successful_version=version,
                              operation_id=request.operation_id,
                              updated_at=_utc_now(),
                              diagnostics=(),
                              views=views,
                          )
                      else:
                          self._snapshot = DiagramSnapshot(
                              version=version,
                              status="error",
                              source=request.source,
                              digest=request.digest,
                              rendered_digest=current.rendered_digest,
                              last_successful_version=current.last_successful_version,
                              operation_id=request.operation_id,
                              updated_at=_utc_now(),
                              diagnostics=diagnostics,
                              views=current.views,
                          )

              def rebuild_async(self, source: str | None = None) -> DiagramSnapshot:
                  if source is None:
                      source = self._read_disk_source()
                  source_digest = _digest(source)
                  current = self.snapshot
                  if current.digest == source_digest and current.status in {"ready", "compiling"}:
                      return current
                  operation_id = uuid.uuid4().hex
                  snapshot = self._publish_compiling(
                      source,
                      source_digest,
                      operation_id,
                  )
                  self._queue_compile(
                      CompileRequest(operation_id, source, source_digest)
                  )
                  return snapshot

              def save_source_async(
                  self,
                  source: str,
                  *,
                  base_digest: str | None = None,
              ) -> DiagramSnapshot:
                  with self._save_lock:
                      source_digest = self._persist_source(
                          source,
                          base_digest=base_digest,
                      )
                      operation_id = uuid.uuid4().hex
                      snapshot = self._publish_compiling(
                          source,
                          source_digest,
                          operation_id,
                      )
                      self._queue_compile(
                          CompileRequest(operation_id, source, source_digest)
                      )
                      return snapshot

              def save_source(
                  self,
                  source: str,
                  *,
                  base_digest: str | None = None,
              ) -> DiagramSnapshot:
                  """Synchronous compatibility entrypoint for non-interactive callers."""
                  with self._save_lock:
                      self._persist_source(source, base_digest=base_digest)
                      return self.rebuild(source)

              def start_watching('''
          text, count = save_pattern.subn(save_replacement, text, count=1)
          if count != 1:
              raise SystemExit('save_source block replacement failed')

          text = text.replace(
              '                self.rebuild(source)\n',
              '                current = self.snapshot\n'
              '                if current.digest == current_digest and current.status == "compiling":\n'
              '                    continue\n'
              '                self.rebuild_async(source)\n',
              1,
          )
          text = text.replace(
              '                            last_successful_version=current.last_successful_version,\n                            updated_at=',
              '                            last_successful_version=current.last_successful_version,\n                            operation_id=current.operation_id,\n                            updated_at=',
              1,
          )
          text = text.replace(
              '    def stop(self) -> None:\n        self._stop.set()\n',
              '    def stop(self) -> None:\n'
              '        self._stop.set()\n'
              '        with self._compile_condition:\n'
              '            self._compile_condition.notify_all()\n',
              1,
          )
          text = text.replace(
              '        if self._watcher is not None:\n            self._watcher.join(timeout=1.0)\n',
              '        if self._watcher is not None:\n'
              '            self._watcher.join(timeout=1.0)\n'
              '        if self._compile_worker is not None:\n'
              '            self._compile_worker.join(timeout=1.0)\n',
              1,
          )

          save_handler_pattern = re.compile(
              r'                if self\.path == "/api/save":\n.*?                if self\.path == "/api/rebuild":\n                    app\.rebuild\(\)\n                    self\._json\(app\.state_dict\(\)\)\n                    return',
              re.DOTALL,
          )
          save_handler = '''                if self.path == "/api/save":
                      body = self._body()
                      if body is None:
                          return
                      source = body.get("source")
                      base_digest = body.get("base_digest")
                      if not isinstance(source, str):
                          self._json(
                              {"error": "source must be text"},
                              HTTPStatus.BAD_REQUEST,
                          )
                          return
                      if base_digest is not None and not isinstance(base_digest, str):
                          self._json(
                              {"error": "base_digest must be text"},
                              HTTPStatus.BAD_REQUEST,
                          )
                          return
                      try:
                          app.save_source_async(source, base_digest=base_digest)
                      except SaveConflictError as exc:
                          self._json(
                              {
                                  "error": "save_conflict",
                                  "message": str(exc),
                                  "current_source": exc.current_source,
                                  "current_digest": exc.current_digest,
                                  "state": app.state_dict(),
                              },
                              HTTPStatus.CONFLICT,
                          )
                          return
                      except SaveWriteError as exc:
                          self._json(
                              {"error": exc.code, "message": str(exc)},
                              exc.status,
                          )
                          return
                      self._json(app.state_dict(), HTTPStatus.ACCEPTED)
                      return
                  if self.path == "/api/rebuild":
                      try:
                          app.rebuild_async()
                      except SaveWriteError as exc:
                          self._json(
                              {"error": exc.code, "message": str(exc)},
                              exc.status,
                          )
                          return
                      self._json(app.state_dict(), HTTPStatus.ACCEPTED)
                      return'''
          text, count = save_handler_pattern.subn(save_handler, text, count=1)
          if count != 1:
              raise SystemExit('diagram app handler replacement failed')
          app_path.write_text(text)

          desktop_path = Path('glyph/desktop_server.py')
          text = desktop_path.read_text()
          text = text.replace(
              'from .diagram_app import GlyphDiagramApp, SaveConflictError, ViewBuilder',
              'from .diagram_app import (\n'
              '    GlyphDiagramApp,\n'
              '    SaveConflictError,\n'
              '    SaveWriteError,\n'
              '    ViewBuilder,\n'
              ')',
              1,
          )
          desktop_handler_pattern = re.compile(
              r'            if path == "/api/save":\n.*?            if path == "/api/rebuild":\n                app\.rebuild\(\)\n                self\._json\(app\.state_dict\(\)\)\n                return',
              re.DOTALL,
          )
          desktop_handler = '''            if path == "/api/save":
                  body = self._body()
                  if body is None:
                      return
                  source = body.get("source")
                  base_digest = body.get("base_digest")
                  if not isinstance(source, str):
                      self._json({"error": "source must be text"}, HTTPStatus.BAD_REQUEST)
                      return
                  if base_digest is not None and not isinstance(base_digest, str):
                      self._json(
                          {"error": "base_digest must be text"},
                          HTTPStatus.BAD_REQUEST,
                      )
                      return
                  try:
                      app.save_source_async(source, base_digest=base_digest)
                  except SaveConflictError as exc:
                      self._json(
                          {
                              "error": "save_conflict",
                              "message": str(exc),
                              "current_source": exc.current_source,
                              "current_digest": exc.current_digest,
                              "state": app.state_dict(),
                          },
                          HTTPStatus.CONFLICT,
                      )
                      return
                  except SaveWriteError as exc:
                      self._json(
                          {"error": exc.code, "message": str(exc)},
                          exc.status,
                      )
                      return
                  self._json(app.state_dict(), HTTPStatus.ACCEPTED)
                  return
              if path == "/api/rebuild":
                  try:
                      app.rebuild_async()
                  except SaveWriteError as exc:
                      self._json(
                          {"error": exc.code, "message": str(exc)},
                          exc.status,
                      )
                      return
                  self._json(app.state_dict(), HTTPStatus.ACCEPTED)
                  return'''
          text, count = desktop_handler_pattern.subn(desktop_handler, text, count=1)
          if count != 1:
              raise SystemExit('desktop handler replacement failed')
          desktop_path.write_text(text)
          PY
      - name: Commit async server patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glyph/diagram_app.py glyph/desktop_server.py
          git commit -m 'Decouple source saves from diagram compilation'
          git push origin HEAD:agent/macro-space-syntax
