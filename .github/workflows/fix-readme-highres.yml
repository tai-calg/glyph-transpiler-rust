name: Fix README high-resolution screenshots

on:
  push:
    branches:
      - agent/fix-readme-highres-screenshots
    paths:
      - .github/workflows/fix-readme-highres.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-readme-highres-screenshots
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install browser
        run: |
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Render original high-resolution screenshots
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/checked-system-context-io build/state-diagram-regression docs/images
          node tests/verify_code_derived_system_io.mjs
          node tests/verify_state_diagram_rendering.mjs

          STATE_SRC="build/state-diagram-regression/dual-machines-door.png"
          IO_SRC="build/checked-system-context-io/door-controller-checked-system-context.png"

          test -s "$STATE_SRC"
          test -s "$IO_SRC"

          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              Path("build/state-diagram-regression/dual-machines-door.png"): (1800, 1100),
              Path("build/checked-system-context-io/door-controller-checked-system-context.png"): (1800, 1100),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  if image.format != "PNG":
                      raise SystemExit(f"{path}: expected PNG, got {image.format}")
                  if image.size != size:
                      raise SystemExit(f"{path}: expected {size}, got {image.size}")
          PY

          cp "$STATE_SRC" docs/images/glyph-studio-state-transition.png
          cp "$IO_SRC" docs/images/glyph-studio-io.png

          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "docs/images/glyph-studio-state-transition.jpg",
              "docs/images/glyph-studio-state-transition.png",
          )
          text = text.replace(
              "docs/images/glyph-studio-io.jpg",
              "docs/images/glyph-studio-io.png",
          )
          path.write_text(text, encoding="utf-8")
          PY

          rm -f \
            docs/images/glyph-studio-state-transition.jpg \
            docs/images/glyph-studio-io.jpg \
            docs/images/_candidate.png \
            docs/images/_candidate2.png \
            docs/images/_upload-test.txt \
            .github/workflows/fix-readme-highres.yml

      - name: Commit generated PNGs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs/images .github/workflows/fix-readme-highres.yml
          git commit -m "Use lossless high-resolution README screenshots [skip ci]"
          git push origin HEAD:agent/fix-readme-highres-screenshots
