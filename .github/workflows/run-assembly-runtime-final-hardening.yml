name: Run Assembly runtime final hardening

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing
    paths:
      - .github/workflows/run-assembly-runtime-final-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply patch
        run: python scripts/apply_assembly_runtime_final_hardening.py
      - name: Run focused regressions
        run: |
          python -m unittest \
            tests.test_machine_assembly \
            tests.test_machine_assembly_runtime_audit_integrity \
            tests.test_machine_assembly_runtime_final_hardening
      - name: Commit source changes
        shell: bash
        run: |
          rm scripts/apply_assembly_runtime_final_hardening.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/assembly.py glyph/assembly_runtime.py scripts/apply_assembly_runtime_final_hardening.py
          git commit -m "Harden Assembly runtime semantics"
          git push origin HEAD:agent/machine-assembly-immediate-routing
