name: Clean child PR StateTransitionIR v4 runner

on:
  pull_request:
    branches:
      - agent/transition-action-semantics-v4

permissions:
  contents: write

jobs:
  run:
    if: github.head_ref == 'agent/transition-action-v4-final-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transition-action-semantics-v4
          fetch-depth: 0

      - name: Apply migration
        run: python tools/apply_transition_action_v4.py

      - name: Run focused semantic tests
        id: tests
        run: |
          set +e
          python -m unittest \
            tests.test_machine_action_projection \
            tests.test_transition_action_renderer_contract \
            tests.test_transition_io_clusters \
            tests.test_transition_semantics \
            tests.test_nested_transition_repair \
            tests.test_guard_distinct_failure_repair \
            > transition-v4-clean-tests.log 2>&1
          status=$?
          cat transition-v4-clean-tests.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit failure log
        if: steps.tests.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transition-v4-clean-tests.log
          git commit -m "Capture clean StateTransitionIR v4 failure"
          git push origin HEAD:agent/transition-action-semantics-v4

      - name: Commit migration
        if: steps.tests.outputs.status == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            glyph/transition_action_projection.py \
            glyph/transition_condition_roles.py \
            glyph/state_transition_ir_renderer.py \
            tests/test_transition_semantics.py \
            tests/test_nested_transition_repair.py \
            tests/test_guard_distinct_failure_repair.py
          git commit -m "Implement StateTransitionIR v4 Action semantics"
          git push origin HEAD:agent/transition-action-semantics-v4
