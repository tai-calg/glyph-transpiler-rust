name: Widen Adaptive State Layout

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/widen-adaptive-state-layout.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-state-layout-initial-node'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-state-layout-initial-node
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Increase horizontal density allowance
        run: |
          set -euo pipefail
          python3 scripts/widen_adaptive_state_layout_once.py
          python3 -m py_compile glyph/state_diagram_workspace.py
          git diff --check
          git add -A glyph/state_diagram_workspace.py tests/test_layout_state_diagram_workspace.py scripts/widen_adaptive_state_layout_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Widen dense state diagrams before publication"
          git push origin HEAD:agent/adaptive-state-layout-initial-node
