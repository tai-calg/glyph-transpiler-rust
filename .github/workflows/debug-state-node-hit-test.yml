name: Debug State Node Hit Test

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/debug-state-node-hit-test.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/adaptive-state-layout-initial-node'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser
        run: |
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Audit node hit testing
        run: timeout 180s node tests/debug_state_node_hit_test.mjs
      - name: Upload hit-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: state-node-hit-test
          if-no-files-found: warn
          path: build/state-node-hit-test/**
