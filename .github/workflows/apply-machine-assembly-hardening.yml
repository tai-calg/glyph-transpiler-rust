name: Apply Machine Assembly Hardening

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'Install machine assembly hardening applicator'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardening patch
        shell: bash
        run: |
          python - <<'PY'
          import base64, gzip
          payload = ''''''
          open('/tmp/apply_hardening.py','wb').write(gzip.decompress(base64.b64decode(payload)))
          PY
          python /tmp/apply_hardening.py
          python -m py_compile glyph/assembly.py glyph/assembly_frontend.py glyph/assembly_runtime.py glyph/artifacts.py glyph/compilation.py glyph/frontend.py glyph/incremental.py tests/test_machine_assembly_hardening.py
          python -m unittest tests.test_machine_assembly_hardening tests.test_machine_assembly tests.test_machine_assembly_entrypoints tests.test_machine_assembly_runtime_failure tests.test_machine_assembly_runtime_types
      - name: Commit hardened implementation
        shell: bash
        run: |
          git rm .github/workflows/apply-machine-assembly-hardening.yml
          git config user.name 'Tai. Tani.'
          git config user.email '62682789+tai-calg@users.noreply.github.com'
          git add glyph tests
          git commit -m 'Harden machine assembly runtime and compiler integration'
          git push origin HEAD:agent/machine-assembly-immediate-routing
