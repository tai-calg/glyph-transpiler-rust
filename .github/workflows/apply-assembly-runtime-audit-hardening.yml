name: Apply Assembly runtime audit hardening

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing
    paths:
      - .github/workflows/apply-assembly-runtime-audit-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply hardened runtime and regression tests
        shell: bash
        run: |
          python - <<'PYCODE'
          from pathlib import Path
          import base64
          import zlib

          payload_dir = Path('.github/assembly-hardening')
          runtime_payload = ''.join(
              path.read_text(encoding='utf-8').strip()
              for path in sorted(payload_dir.glob('runtime.part*'))
          )
          test_payload = (payload_dir / 'test.b85').read_text(encoding='utf-8').strip()
          Path('glyph/assembly_runtime.py').write_bytes(
              zlib.decompress(base64.b85decode(runtime_payload.encode('ascii')))
          )
          Path('tests/test_machine_assembly_runtime_audit_integrity.py').write_bytes(
              zlib.decompress(base64.b85decode(test_payload.encode('ascii')))
          )

          path = Path('glyph/assembly.py')
          source = path.read_text(encoding='utf-8')
          start = source.index('class FrozenMapping')
          end = source.index('@dataclass(frozen=True)\nclass AssemblyInstance')
          replacement = '''class FrozenMapping(tuple, MappingABC[str, object]):
              """Tuple-backed recursively immutable mapping for Assembly IR records."""

              __slots__ = ()

              def __new__(cls, values: Mapping[str, object]):
                  if not isinstance(values, Mapping):
                      raise TypeError("FrozenMappingにはMappingが必要")
                  return tuple.__new__(
                      cls,
                      tuple((str(key), _freeze(value)) for key, value in values.items()),
                  )

              def __getitem__(self, key: str) -> object:
                  for item_key, item_value in tuple.__iter__(self):
                      if item_key == key:
                          return item_value
                  raise KeyError(key)

              def __iter__(self) -> Iterator[str]:
                  return (key for key, _ in tuple.__iter__(self))

              def __repr__(self) -> str:
                  body = ", ".join(
                      f"{key!r}: {value!r}"
                      for key, value in tuple.__iter__(self)
                  )
                  return f"FrozenMapping({{{body}}})"

              def __deepcopy__(self, memo):
                  return self


          _IMMUTABLE_IR_SCALARS = (str, bytes, int, float, bool, type(None))


          def _freeze(value: object) -> object:
              if isinstance(value, FrozenMapping):
                  return value
              if isinstance(value, Mapping):
                  return FrozenMapping(value)
              if isinstance(value, (tuple, list)):
                  return tuple(_freeze(item) for item in value)
              if isinstance(value, (set, frozenset)):
                  return frozenset(_freeze(item) for item in value)
              if isinstance(value, _IMMUTABLE_IR_SCALARS):
                  return value
              raise TypeError(
                  "Assembly IRに保持できない可変または不透明な値: "
                  f"{type(value).__module__}.{type(value).__qualname__}"
              )


          def _thaw(value: object) -> object:
              if isinstance(value, Mapping):
                  return {str(key): _thaw(item) for key, item in value.items()}
              if isinstance(value, tuple):
                  return [_thaw(item) for item in value]
              if isinstance(value, frozenset):
                  return [_thaw(item) for item in sorted(value, key=repr)]
              return value


          '''
          import textwrap
          replacement = textwrap.dedent(replacement)
          path.write_text(source[:start] + replacement + source[end:], encoding='utf-8')
          PYCODE
      - name: Run Assembly tests
        shell: bash
        run: |
          python -m pip install --quiet pytest
          python -m pytest -q tests/test_machine_assembly*.py
      - name: Commit hardened implementation
        shell: bash
        run: |
          rm -rf .github/assembly-hardening
          rm .github/workflows/apply-assembly-runtime-audit-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Assembly runtime audit and IR validation"
          git push origin HEAD:agent/machine-assembly-immediate-routing
