name: Repair Semantic Label Collisions

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/fix-semantic-label-collision.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/system-entry-source-sink'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-entry-source-sink
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply bounded collision repair
        run: |
          set -euo pipefail
          python3 scripts/fix_semantic_label_collision_once.py
          python3 -m unittest tests.test_transition_io_clusters tests.test_transition_enabling_cases -v
          git add -A glyph/transition_io_clusters.py glyph/transition_enabling_case_rendering.py tests/test_transition_io_clusters.py scripts/fix_semantic_label_collision_once.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "Repair semantic label collisions within bounded layout"
          git push origin HEAD:agent/system-entry-source-sink
