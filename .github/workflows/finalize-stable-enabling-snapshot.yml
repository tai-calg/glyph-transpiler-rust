name: Finalize Stable Enabling Snapshot

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/finalize-stable-enabling-snapshot.yml"

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Require stable final layout before screenshots
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/verify_state_diagram_rendering.mjs')
          text = path.read_text(encoding='utf-8')
          start_marker = '        await page.waitForFunction(({machineName, transitionCount}) => {'
          end_marker = '        }, { machineName: expected.name, transitionCount: machine.transitions.length });'
          start = text.index(start_marker, text.index('for (const expected of testCase.machines)'))
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''        await page.waitForFunction(({machineName, transitionCount}) => {
          const stage = document.querySelector(".graph-stage"), transaction = window.glyphTransitionLayoutTransaction;
          return document.querySelector("#machine-select")?.selectedOptions?.[0]?.textContent === machineName
            && stage?.dataset.transitionIoClustersReady === "true"
            && stage?.dataset.transitionEnablingCasesReady === "true"
            && stage?.dataset.transitionLayoutState === "ready"
            && stage?.dataset.transitionIoCollisionSolved === "true"
            && stage?.dataset.transitionIoCollisionCount === "0"
            && transaction?.generation === transaction?.completedGeneration
            && stage.querySelectorAll(".transition-io-cluster").length === transitionCount;
        }, { machineName: expected.name, transitionCount: machine.transitions.length });
        const stableLayout = await page.evaluate(() => ({
          generation: window.glyphTransitionLayoutTransaction?.generation,
          completedGeneration: window.glyphTransitionLayoutTransaction?.completedGeneration,
          positions: [...document.querySelectorAll(".transition-io-cluster")].map(cluster => [
            cluster.dataset.transitionId,
            cluster.style.left,
            cluster.style.top,
            cluster.dataset.ioValue,
          ]),
        }));
        await page.waitForTimeout(500);
        const settledLayout = await page.evaluate(() => ({
          generation: window.glyphTransitionLayoutTransaction?.generation,
          completedGeneration: window.glyphTransitionLayoutTransaction?.completedGeneration,
          positions: [...document.querySelectorAll(".transition-io-cluster")].map(cluster => [
            cluster.dataset.transitionId,
            cluster.style.left,
            cluster.style.top,
            cluster.dataset.ioValue,
          ]),
        }));
        assert.deepEqual(settledLayout, stableLayout, `${testCase.slug}/${expected.name}: layout changed after ready`);'''
          path.write_text(text[:start] + replacement + text[end:], encoding='utf-8')
          PY
      - name: Install renderer
        run: |
          python -m pip install pillow==12.0.0
          npm install --no-save playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Prove independent renders are stable
        run: |
          node tests/verify_enabling_case_rendering.mjs
          node tests/verify_state_diagram_rendering.mjs
          cp build/state-diagram-regression/motor-safety-motor.png /tmp/motor-a.png
          rm -rf build/state-diagram-regression
          node tests/verify_state_diagram_rendering.mjs
          cp build/state-diagram-regression/motor-safety-motor.png /tmp/motor-b.png
          python - <<'PY'
          from pathlib import Path
          import runpy
          compare_images = runpy.run_path('tests/verify_readme_state_snapshot.py')['compare_images']
          changed, mean, maximum, size = compare_images(Path('/tmp/motor-a.png'), Path('/tmp/motor-b.png'))
          print(f'independent stable render delta: changed={changed}, mean={mean:.8f}, max={maximum}, size={size}')
          if changed > 256 or mean > 0.001 or maximum > 32:
              raise SystemExit('stable final-code renders still differ')
          PY
      - name: Publish and independently verify README PNG
        run: |
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
          rm -rf build/state-diagram-regression
          node tests/verify_state_diagram_rendering.mjs
          python tests/verify_readme_state_snapshot.py
          rm .github/workflows/finalize-stable-enabling-snapshot.yml
          rm .github/workflows/refresh-deterministic-enabling-case-png.yml
      - name: Commit verified test and image only
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/verify_state_diagram_rendering.mjs
          git add docs/images/glyph-studio-state-transition.png
          git add -u .github/workflows/finalize-stable-enabling-snapshot.yml
          git add -u .github/workflows/refresh-deterministic-enabling-case-png.yml
          git commit -m "Stabilize and publish Input Guard snapshot"
          git push origin "HEAD:${HEAD_REF}"
