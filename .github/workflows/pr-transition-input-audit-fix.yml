name: Apply transition Input audit fixes

on:
  pull_request:
    branches:
      - agent/revert-invalid-readme-action-image

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/transition-input-audit-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revert-invalid-readme-action-image
          fetch-depth: 0

      - name: Apply conservative Input-preimage fixes
        run: python3 tools/_apply_transition_input_audit_fixes.py

      - name: Run focused provenance audit
        run: |
          python3 -m unittest \
            tests.test_transition_input_provenance \
            tests.test_transition_input_provenance_audit \
            tests.test_transition_semantics

      - name: Commit compiler and audit updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glyph/transition_input_provenance.py tests/test_transition_input_provenance_audit.py
          git commit -m "Make Input preimage expansion conservative"
          git push origin HEAD:agent/revert-invalid-readme-action-image
