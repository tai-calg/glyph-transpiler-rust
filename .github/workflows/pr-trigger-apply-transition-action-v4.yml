name: Child PR StateTransitionIR v4 application

on:
  pull_request:
    branches:
      - agent/transition-action-semantics-v4

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/transition-action-v4-child-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transition-action-semantics-v4
          fetch-depth: 0

      - name: Apply v4 consumer and test updates
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/apply-transition-action-v4.yml').read_text(encoding='utf-8')
          start = '      - name: Apply v4 consumer and test updates\n        run: |\n'
          end = '\n\n      - name: Run focused semantic tests\n'
          if start not in source or end not in source:
              raise SystemExit('v4 application block not found')
          block = source.split(start, 1)[1].split(end, 1)[0]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          subprocess.run(['bash', '-lc', script], check=True)
          PY

      - name: Run focused semantic tests
        run: |
          python -m unittest \
            tests.test_machine_action_projection \
            tests.test_transition_action_renderer_contract \
            tests.test_transition_io_clusters \
            tests.test_transition_semantics \
            tests.test_nested_transition_repair \
            tests.test_guard_distinct_failure_repair

      - name: Commit v4 consumer changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            glyph/transition_condition_roles.py \
            glyph/state_transition_ir_renderer.py \
            tests/test_transition_semantics.py \
            tests/test_nested_transition_repair.py \
            tests/test_guard_distinct_failure_repair.py
          git commit -m "Separate transition Actions from Effects"
          git push origin HEAD:agent/transition-action-semantics-v4
