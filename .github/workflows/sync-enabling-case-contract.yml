name: Sync Enabling Case Contract

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/sync-enabling-case-contract.yml"

permissions:
  contents: write

jobs:
  sync:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Synchronize additive version contract
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('tests/test_transition_enabling_cases.py')
          value = test.read_text(encoding='utf-8')
          value = value.replace('views["state_transition_ir"]["version"], 5', 'views["state_transition_ir"]["version"], 4')
          test.write_text(value, encoding='utf-8')

          design = Path('docs/design/transition-enabling-cases-v1.md')
          value = design.read_text(encoding='utf-8')
          value = value.replace(
              'StateTransitionIR version becomes 5. Each transition may contain:',
              'StateTransitionIR remains version 4 for reader compatibility. The additive `transition_enabling_cases_version=1` contract allows each transition to contain:'
          )
          value = value.replace(
              '- StateTransitionIR v4 readers continue through Legacy Projection.\n- StateTransitionIR v5 renderers must consume `enabling_cases`.',
              '- StateTransitionIR v4 readers continue through Legacy Projection.\n- Enabling-case-aware renderers must consume `enabling_cases` when `transition_enabling_cases_version >= 1`.'
          )
          design.write_text(value, encoding='utf-8')
          PY
      - name: Commit synchronized files
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_transition_enabling_cases.py docs/design/transition-enabling-cases-v1.md
          git commit -m "Align enabling cases with additive v4 compatibility"
          git push origin "HEAD:${HEAD_REF}"
