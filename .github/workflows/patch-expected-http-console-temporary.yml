name: Temporary Expected HTTP Console Patch

on:
  push:
    branches:
      - agent/macro-space-syntax

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macro-space-syntax
      - name: Count only expected HTTP console errors
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/verify_save_triggered_studio.mjs')
          text = path.read_text()
          old = '''  const browserErrors = [];
          page.on("pageerror", error => browserErrors.push(`pageerror: ${error.stack || error.message}`));
          page.on("console", message => {
            if (message.type() === "error") browserErrors.push(`console: ${message.text()}`);
          });
          '''
          new = '''  const browserErrors = [];
          let expectedHttpConsoleErrors = 0;
          page.on("pageerror", error => browserErrors.push(`pageerror: ${error.stack || error.message}`));
          page.on("console", message => {
            if (message.type() !== "error") return;
            const text = message.text();
            if (expectedHttpConsoleErrors > 0 && text.includes("Failed to load resource")) {
              expectedHttpConsoleErrors -= 1;
              return;
            }
            browserErrors.push(`console: ${text}`);
          });
          '''
          if old not in text:
              raise SystemExit('browser error handler anchor missing')
          text = text.replace(old, new, 1)

          old = '''  await page.click('#glyph-conflict-dialog [data-action="load"]');
          const failedLoad = await waitForAudit(
          '''
          new = '''  expectedHttpConsoleErrors += 1;
          await page.click('#glyph-conflict-dialog [data-action="load"]');
          const failedLoad = await waitForAudit(
          '''
          if old not in text:
              raise SystemExit('expected 500 anchor missing')
          text = text.replace(old, new, 1)

          old = '''  await page.waitForTimeout(60);
          await page.click('#glyph-conflict-dialog [data-action="overwrite"]');
          const repeatedConflict = await waitForAudit(
          '''
          new = '''  await page.waitForTimeout(60);
          expectedHttpConsoleErrors += 1;
          await page.click('#glyph-conflict-dialog [data-action="overwrite"]');
          const repeatedConflict = await waitForAudit(
          '''
          if old not in text:
              raise SystemExit('expected 409 anchor missing')
          text = text.replace(old, new, 1)

          old = '''  assert.deepEqual(browserErrors, [], `save-triggered Studio emitted browser errors:\n${browserErrors.join("\\n")}`);
          '''
          new = '''  assert.equal(expectedHttpConsoleErrors, 0, "expected HTTP console errors were not observed");
          assert.deepEqual(browserErrors, [], `save-triggered Studio emitted browser errors:\n${browserErrors.join("\\n")}`);
          '''
          if old not in text:
              raise SystemExit('final browser error assertion anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/verify_save_triggered_studio.mjs
          git commit -m 'Distinguish expected conflict HTTP errors in browser checks'
          git push origin HEAD:agent/macro-space-syntax
