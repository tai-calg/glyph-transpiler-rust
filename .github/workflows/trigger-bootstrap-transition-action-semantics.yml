name: Trigger transition action bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/transition-action-semantics-v4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run bootstrap implementation block
        id: bootstrap
        run: |
          set +e
          python - <<'PY' > bootstrap-debug.log 2>&1
          from pathlib import Path
          import subprocess

          source = Path('.github/workflows/bootstrap-transition-action-semantics.yml').read_text(encoding='utf-8')
          marker = '      - name: Implement action projection and renderer contract\n        run: |\n'
          tail = '\n\n      - name: Run focused tests\n'
          if marker not in source or tail not in source:
              raise SystemExit('bootstrap workflow block not found')
          block = source.split(marker, 1)[1].split(tail, 1)[0]
          lines = block.splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          subprocess.run(['bash', '-lc', script], check=True)
          PY
          status=$?
          cat bootstrap-debug.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Normalize generated focused tests
        if: steps.bootstrap.outputs.status == '0'
        run: |
          cat > tests/test_machine_action_projection.py <<'PYTEST'
          from __future__ import annotations

          import unittest

          from glyph.compiler import GlyphError, parse_program
          from glyph.machine import extract_machines, validate_machines


          VALID = """\
          machine Door(state:DoorState,input:Input)
            select=state.mode
            action=state.action
            init=DoorState(Locked,KeepLocked)
            next=step(state,input)
            success=Unlocked
            failure=Faulted

          +Input=OpenRequest|NoRequest
          +Mode=Locked|Unlocked|Faulted
          +Action=KeepLocked|Unlock
          *DoorState(mode:Mode,action:Action)

          >step(state:DoorState,input:Input):DoorState=DoorState(Unlocked,Unlock)
          """


          class MachineActionProjectionTests(unittest.TestCase):
              def compile_machine(self, source: str):
                  remainder, machines = extract_machines(source)
                  program = parse_program(remainder)
                  validate_machines(program, machines)
                  self.assertEqual(len(machines), 1)
                  return machines[0]

              def test_action_projection_is_optional_and_typed(self) -> None:
                  machine = self.compile_machine(VALID)
                  self.assertIsNotNone(machine.action_selector)
                  self.assertEqual(machine.action_selector.field, "action")

                  legacy = VALID.replace("  action=state.action\n", "")
                  legacy_machine = self.compile_machine(legacy)
                  self.assertIsNone(legacy_machine.action_selector)

              def test_action_and_select_cannot_share_a_field(self) -> None:
                  source = VALID.replace("action=state.action", "action=state.mode")
                  remainder, machines = extract_machines(source)
                  with self.assertRaisesRegex(GlyphError, "actionとselectは同じfield"):
                      validate_machines(parse_program(remainder), machines)

              def test_action_projection_must_target_a_sum_typed_state_field(self) -> None:
                  source = (
                      VALID.replace("action=state.action", "action=state.count")
                      .replace(
                          "*DoorState(mode:Mode,action:Action)",
                          "*DoorState(mode:Mode,action:Action,count:U)",
                      )
                      .replace(
                          "DoorState(Locked,KeepLocked)",
                          "DoorState(Locked,KeepLocked,0)",
                      )
                      .replace(
                          "DoorState(Unlocked,Unlock)",
                          "DoorState(Unlocked,Unlock,0)",
                      )
                  )
                  remainder, machines = extract_machines(source)
                  with self.assertRaisesRegex(GlyphError, "直和型でなければならない"):
                      validate_machines(parse_program(remainder), machines)


          if __name__ == "__main__":
              unittest.main()
          PYTEST

      - name: Commit bootstrap diagnostics
        if: steps.bootstrap.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bootstrap-debug.log
          git commit -m "Capture transition bootstrap failure"
          git push origin HEAD:${{ github.head_ref }}

      - name: Run focused tests
        id: focused
        if: steps.bootstrap.outputs.status == '0'
        run: |
          set +e
          python -m unittest tests.test_machine_action_projection tests.test_transition_action_renderer_contract > focused-test-debug.log 2>&1
          status=$?
          cat focused-test-debug.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit focused test diagnostics
        if: steps.bootstrap.outputs.status == '0' && steps.focused.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add focused-test-debug.log
          git commit -m "Capture focused transition test failure"
          git push origin HEAD:${{ github.head_ref }}

      - name: Commit implementation
        if: steps.bootstrap.outputs.status == '0' && steps.focused.outputs.status == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glyph/machine.py glyph/transition_io_clusters.py examples/acceptance/door_controller.glyph tests/test_machine_action_projection.py tests/test_transition_action_renderer_contract.py
          git commit -m "Start transition action semantics v4"
          git push origin HEAD:${{ github.head_ref }}
