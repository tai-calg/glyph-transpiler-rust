name: Trigger transition action bootstrap

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.head_ref == 'agent/transition-action-semantics-v4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Run bootstrap implementation block
        id: bootstrap
        run: |
          set +e
          python - <<'PY' > bootstrap-debug.log 2>&1
          from pathlib import Path
          import subprocess
          import textwrap

          source = Path('.github/workflows/bootstrap-transition-action-semantics.yml').read_text(encoding='utf-8')
          marker = '      - name: Implement action projection and renderer contract\n        run: |\n'
          tail = '\n\n      - name: Run focused tests\n'
          if marker not in source or tail not in source:
              raise SystemExit('bootstrap workflow block not found')
          block = source.split(marker, 1)[1].split(tail, 1)[0]
          script = textwrap.dedent(block)
          subprocess.run(['bash', '-lc', script], check=True)
          PY
          status=$?
          cat bootstrap-debug.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit bootstrap diagnostics
        if: steps.bootstrap.outputs.status != '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add bootstrap-debug.log
          git commit -m "Capture transition bootstrap failure"
          git push origin HEAD:${{ github.head_ref }}

      - name: Run focused tests
        if: steps.bootstrap.outputs.status == '0'
        run: |
          python -m unittest tests.test_machine_action_projection tests.test_transition_action_renderer_contract

      - name: Commit implementation
        if: steps.bootstrap.outputs.status == '0'
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glyph/machine.py glyph/transition_io_clusters.py examples/acceptance/door_controller.glyph tests/test_machine_action_projection.py tests/test_transition_action_renderer_contract.py
          git commit -m "Start transition action semantics v4"
          git push origin HEAD:${{ github.head_ref }}
