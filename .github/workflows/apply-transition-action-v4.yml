name: Apply StateTransitionIR v4 Action semantics

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'agent/transition-action-semantics-v4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply v4 consumer and test updates
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:120]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          roles = "glyph/transition_condition_roles.py"
          replace_once(roles, "STATE_TRANSITION_IR_VERSION = 3\n", "STATE_TRANSITION_IR_VERSION = 4\n")
          replace_once(
              roles,
              "def _display_label(\n",
              "def _action_display(action: object) -> str:\n"
              "    if isinstance(action, Mapping):\n"
              "        return str(action.get(\"display\") or action.get(\"expression\") or \"\")\n"
              "    return \"\" if action is None else str(action)\n\n\n"
              "def _display_label(\n",
          )
          replace_once(roles, "    action: str | None,\n", "    action: object,\n")
          replace_once(roles, "    label = \"\"\n", "    label = \"\"\n    action_text = _action_display(action)\n")
          replace_once(
              roles,
              "    if action:\n        label += f\" / {action}\" if label else f\"/ {action}\"\n",
              "    if action_text:\n        label += f\" / {action_text}\" if label else f\"/ {action_text}\"\n",
          )

          renderer = "glyph/state_transition_ir_renderer.py"
          replace_once(
              renderer,
              "  function actionOf(transition) {\n"
              "    const action = text(transition?.action) || \"—\";\n"
              "    const failure = text(transition?.failure_type);\n"
              "    return failure ? `${action} | ${failure}` : action;\n"
              "  }\n",
              "  function actionOf(transition) {\n"
              "    const raw = transition?.action;\n"
              "    const action = typeof raw === \"string\"\n"
              "      ? text(raw)\n"
              "      : text(raw?.display) || text(raw?.expression);\n"
              "    const failure = text(transition?.failure_type);\n"
              "    if (action && failure) return `${action} | ${failure}`;\n"
              "    return action || (failure ? `| ${failure}` : \"—\");\n"
              "  }\n",
          )
          replace_once(
              renderer,
              "        transition.action ?? \"\",\n",
              "        JSON.stringify(transition.action ?? null),\n",
          )
          replace_once(
              renderer,
              '    """Render v3 trigger/guard/effect roles without reclassifying compiler semantics."""\n',
              '    """Render trigger/guard/Action roles without reclassifying compiler semantics."""\n',
          )

          semantics = "tests/test_transition_semantics.py"
          text = Path(semantics).read_text(encoding="utf-8")
          text = text.replace("def assert_v3", "def assert_v4")
          text = text.replace("self.assert_v3", "self.assert_v4")
          text = text.replace('{"schema": "glyph.state-transition-ir", "version": 3}', '{"schema": "glyph.state-transition-ir", "version": 4}')
          text = text.replace('self.assertEqual(machine["transition_ir"]["version"], 3)', 'self.assertEqual(machine["transition_ir"]["version"], 4)')
          text = text.replace('self.assertEqual(machine["analysis"]["transition_ir_version"], 3)', 'self.assertEqual(machine["analysis"]["transition_ir_version"], 4)')
          text = text.replace('                "action",\n                "failure_type",', '                "action",\n                "effect_invocations",\n                "failure_type",')
          old = '''        self.assertEqual(normal["action"], "write_pump(true)")
        self.assertIsNone(normal["failure_type"])
        self.assertEqual(normal["display_label"], "PumpStart / write_pump(true)")
'''
          new = '''        self.assertIsNone(normal["action"])
        self.assertEqual(
            [item["expression"] for item in normal["effect_invocations"]],
            ["write_pump(true)"],
        )
        self.assertIsNone(normal["failure_type"])
        self.assertEqual(normal["display_label"], "PumpStart")
'''
          if old not in text: raise SystemExit("pump normal test anchor missing")
          text = text.replace(old, new, 1)
          old = '''        self.assertEqual(failure["action"], "write_pump(true)")
        self.assertEqual(failure["failure_type"], "WriteError")
        self.assertEqual(failure["outcome"], "failure")
        self.assertEqual(
            failure["display_label"],
            "PumpStart / write_pump(true) | WriteError",
        )
'''
          new = '''        self.assertIsNone(failure["action"])
        self.assertEqual(
            [item["expression"] for item in failure["effect_invocations"]],
            ["write_pump(true)"],
        )
        self.assertEqual(failure["failure_type"], "WriteError")
        self.assertEqual(failure["outcome"], "failure")
        self.assertEqual(failure["display_label"], "PumpStart | WriteError")
'''
          if old not in text: raise SystemExit("pump failure test anchor missing")
          text = text.replace(old, new, 1)
          old = '''        self.assertEqual(start["action"], "set_conveyor(input.speed)")
        self.assertEqual(
            start["display_label"],
            "ConveyorStart [input.clear] / set_conveyor(input.speed)",
        )
'''
          new = '''        self.assertIsNone(start["action"])
        self.assertEqual(
            [item["expression"] for item in start["effect_invocations"]],
            ["set_conveyor(input.speed)"],
        )
        self.assertEqual(start["display_label"], "ConveyorStart [input.clear]")
'''
          if old not in text: raise SystemExit("conveyor test anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '        self.assertEqual(failure["action"], "set_conveyor(input.speed)")\n',
              '        self.assertIsNone(failure["action"])\n'
              '        self.assertEqual(\n'
              '            [item["expression"] for item in failure["effect_invocations"]],\n'
              '            ["set_conveyor(input.speed)"],\n'
              '        )\n',
              1,
          )
          old = '''        self.assertEqual(opened["action"], "write_valve(true)")
        self.assertEqual(
            opened["display_label"],
            "ValveOpenRequest / write_valve(true)",
        )
'''
          new = '''        self.assertIsNone(opened["action"])
        self.assertEqual(
            [item["expression"] for item in opened["effect_invocations"]],
            ["write_valve(true)"],
        )
        self.assertEqual(opened["display_label"], "ValveOpenRequest")
'''
          if old not in text: raise SystemExit("valve test anchor missing")
          text = text.replace(old, new, 1)
          text = text.replace(
              '        self.assertEqual(failure["action"], "write_valve(true)")\n',
              '        self.assertIsNone(failure["action"])\n'
              '        self.assertEqual(\n'
              '            [item["expression"] for item in failure["effect_invocations"]],\n'
              '            ["write_valve(true)"],\n'
              '        )\n',
              1,
          )
          text = text.replace(
              '            and item.get("action") == "write_fan(0.0)"\n',
              '            and any(\n'
              '                effect.get("expression") == "write_fan(0.0)"\n'
              '                for effect in item.get("effect_invocations", [])\n'
              '            )\n',
              1,
          )
          door_anchor = '''        self.assertEqual(alarm["event"], "RaiseAlarm")
        self.assertNotIn("[action==RaiseAlarm]", alarm["display_label"])
'''
          door_replacement = '''        self.assertEqual(alarm["event"], "RaiseAlarm")
        self.assertEqual(alarm["target_state"], "Alarmed")
        self.assertEqual(alarm["action"]["display"], "RaiseAlarm")
        self.assertEqual(alarm["action"]["provenance"], "machine-action-projection")
        self.assertNotEqual(alarm["action"]["display"], alarm["target_state"])
        self.assertEqual(alarm["effect_invocations"], [])
        self.assertNotIn("[action==RaiseAlarm]", alarm["display_label"])
'''
          if door_anchor not in text: raise SystemExit("door Action test anchor missing")
          text = text.replace(door_anchor, door_replacement, 1)
          Path(semantics).write_text(text, encoding="utf-8")

          nested = Path("tests/test_nested_transition_repair.py")
          text = nested.read_text(encoding="utf-8")
          text = text.replace(
              '                and transition.get("action") == "write_valve(true)"\n',
              '                and any(\n'
              '                    effect.get("expression") == "write_valve(true)"\n'
              '                    for effect in transition.get("effect_invocations", [])\n'
              '                )\n',
              1,
          )
          nested.write_text(text, encoding="utf-8")

          guard = Path("tests/test_guard_distinct_failure_repair.py")
          text = guard.read_text(encoding="utf-8")
          text = text.replace(
              '            and transition.get("action") == "write_fan(0.0)"\n',
              '            and any(\n'
              '                effect.get("expression") == "write_fan(0.0)"\n'
              '                for effect in transition.get("effect_invocations", [])\n'
              '            )\n',
              1,
          )
          guard.write_text(text, encoding="utf-8")
          PY

      - name: Run focused semantic tests
        run: |
          python -m unittest \
            tests.test_machine_action_projection \
            tests.test_transition_action_renderer_contract \
            tests.test_transition_io_clusters \
            tests.test_transition_semantics \
            tests.test_nested_transition_repair \
            tests.test_guard_distinct_failure_repair

      - name: Commit v4 consumer changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add \
            glyph/transition_condition_roles.py \
            glyph/state_transition_ir_renderer.py \
            tests/test_transition_semantics.py \
            tests/test_nested_transition_repair.py \
            tests/test_guard_distinct_failure_repair.py
          git commit -m "Separate transition Actions from Effects"
          git push origin HEAD:${{ github.head_ref }}
