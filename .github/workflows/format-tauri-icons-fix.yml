name: Format Tauri icon fix

on:
  push:
    branches: [fix/tauri-icons]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/tauri-icons
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml
      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/format-tauri-icons-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add desktop/src-tauri/src/main.rs .github/workflows/format-tauri-icons-fix.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Format Tauri desktop shell"
          git push origin HEAD:fix/tauri-icons
