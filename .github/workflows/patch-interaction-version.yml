name: Patch Interaction Version

on:
  push:
    branches:
      - agent/system-action-control-flow-completeness-v2

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.repository == 'tai-calg/glyph-transpiler-rust' &&
      !contains(github.event.head_commit.message, '[skip-interaction-version-patch]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-action-control-flow-completeness-v2
          fetch-depth: 1

      - name: Update interaction contract version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/verify_transition_layout_transaction.mjs')
          text = path.read_text(encoding='utf-8')
          old = '  assert.equal(result.interactionVersion, 3, JSON.stringify(result));'
          new = '  assert.equal(result.interactionVersion, 4, JSON.stringify(result));'
          if old not in text:
              raise SystemExit('expected interaction version assertion not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/verify_transition_layout_transaction.mjs
          git commit -m "Update layout interaction contract version [skip-interaction-version-patch]"
          git push origin HEAD:agent/system-action-control-flow-completeness-v2
