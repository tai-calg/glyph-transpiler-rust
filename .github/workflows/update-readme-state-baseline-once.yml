name: Update README State Baseline Once

on:
  push:
    branches:
      - agent/system-action-control-flow-completeness-v2
    paths:
      - ".github/workflows/update-readme-state-baseline-once.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/system-action-control-flow-completeness-v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install renderer dependencies
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium

      - name: Generate and verify publication image
        shell: bash
        run: |
          set -euo pipefail
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
          python tests/verify_readme_state_snapshot.py

      - name: Commit baseline and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-readme-state-baseline-once.yml
          git add docs/images/glyph-studio-state-transition.png
          git diff --cached --check
          git commit -m "Update certified README state diagram"
          git push origin HEAD:agent/system-action-control-flow-completeness-v2
