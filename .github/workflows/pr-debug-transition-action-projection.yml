name: Debug child PR transition Action projection

on:
  pull_request:
    branches:
      - agent/transition-action-semantics-v4

permissions:
  contents: write

jobs:
  debug:
    if: github.head_ref == 'agent/transition-action-v4-child-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transition-action-semantics-v4
          fetch-depth: 0

      - name: Generate projection diagnostics
        run: |
          python - <<'PY' > transition-action-projection-debug.log
          from pathlib import Path

          from glyph.compilation import CompilationPipeline
          from glyph.compiler import CallExpr, FunctionDecl, NameExpr, ProductDecl, SumDecl
          from glyph.execution_ir import render_expr
          from glyph.io_state_views import build_io_state_views
          from glyph.state_transition_compiler import _root_branches

          path = Path('examples/acceptance/door_controller.glyph')
          output = CompilationPipeline().compile_text(path.read_text(encoding='utf-8'), source_name=str(path))
          model = output.model
          views = build_io_state_views(model, output.diagrams.ir)
          machine = model.machines[0]
          state_decl = next(item for item in model.program.declarations if isinstance(item, ProductDecl) and item.name == machine.state_param.ty.name)
          selector_index = next(index for index, field in enumerate(state_decl.fields) if field.name == machine.selector.field)
          selector_sum = next(item for item in model.program.declarations if isinstance(item, SumDecl) and item.name == state_decl.fields[selector_index].ty.name)
          functions = {item.name: item for item in model.program.declarations if isinstance(item, FunctionDecl)}
          next_call = machine.next_expr
          assert isinstance(next_call, CallExpr) and isinstance(next_call.callee, NameExpr)
          branches = _root_branches(
              next_call.callee.name,
              functions=functions,
              state_decl=state_decl,
              selector_index=selector_index,
              variants={item.name for item in selector_sum.variants},
              root_state_param=machine.state_param.name,
          )
          print('ACTION SELECTOR', render_expr(machine.action_selector) if machine.action_selector else None)
          print('BLOCKS')
          for block in model.blocks:
              print(block.to_dict())
          print('FUNCTIONS')
          for name, function in functions.items():
              print(
                  name,
                  function.line,
                  render_expr(function.expression) if function.expression is not None else None,
                  [
                      (
                          clause.line,
                          render_expr(clause.condition) if clause.condition is not None else 'otherwise',
                          render_expr(clause.value),
                      )
                      for clause in function.guards
                  ],
              )
          print('BRANCHES')
          for branch in branches:
              print(branch.line, branch.target, render_expr(branch.condition) if branch.condition else 'otherwise', render_expr(branch.value))
          print('TRANSITIONS')
          public = views['state']['machines'][0]
          for transition in public['transitions']:
              print(
                  transition.get('id'),
                  transition.get('source', {}).get('line'),
                  transition.get('source_state'),
                  transition.get('target_state'),
                  transition.get('condition_raw'),
                  transition.get('action'),
                  transition.get('effect_invocations'),
              )
          PY

      - name: Commit projection diagnostics
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add transition-action-projection-debug.log
          git commit -m "Capture transition Action projection diagnostics"
          git push origin HEAD:agent/transition-action-semantics-v4
