name: Fix Assembly hardening job guard

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing
    paths:
      - .github/workflows/fix-assembly-hardening-job.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
          fetch-depth: 0
      - name: Fix guard and retrigger hardening
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-assembly-runtime-final-hardening.yml')
          text = path.read_text(encoding='utf-8')
          old = "          assert 'deepcopy' not in text\n"
          new = "          assert 'from copy import deepcopy' not in text\n"
          if old not in text:
              raise SystemExit('expected guard not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          rm .github/workflows/fix-assembly-hardening-job.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/apply-assembly-runtime-final-hardening.yml .github/workflows/fix-assembly-hardening-job.yml
          git commit -m "Fix Assembly hardening guard"
          git push origin HEAD:agent/machine-assembly-immediate-routing
