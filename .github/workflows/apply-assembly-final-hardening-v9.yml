name: Apply Assembly final hardening v9

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing
    paths:
      - .github/workflows/apply-assembly-final-hardening-v9.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
          fetch-depth: 0

      - name: Apply source hardening
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path(
              ".github/workflows/apply-assembly-final-hardening-v4.yml"
          ).read_text(encoding="utf-8")
          script = workflow.split("python - <<'PY'\n", 1)[1].split("\n          PY", 1)[0]
          script = textwrap.dedent(script)
          script = script[:script.index('Path("tests/test_machine_assembly_runtime_hardening_v2.py").write_text')]
          exec(compile(script, "<assembly-hardening-v4>", "exec"))

          runtime_path = Path("glyph/assembly_runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")
          runtime = runtime.replace(
              "同一Assembly Runtimeへのtop-level反応の再入・並行実行は禁止",
              "同一Assembly Runtimeへのtop-level反応の再入は禁止（並行実行も禁止）",
          )
          runtime_path.write_text(runtime, encoding="utf-8")
          PY

      - name: Run focused Assembly tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            glyph/assembly.py \
            glyph/assembly_runtime.py \
            tests/test_machine_assembly_runtime_hardening_v2.py
          python -m unittest -v \
            tests.test_machine_assembly \
            tests.test_machine_assembly_hardening \
            tests.test_machine_assembly_runtime_types \
            tests.test_machine_assembly_runtime_hardening_v2

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-assembly-final-hardening*.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Assembly immutability and runtime boundaries"
          git push origin HEAD:agent/machine-assembly-immediate-routing
