name: Fix polling browser waits

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'fix/diagram-preview-stall' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/diagram-preview-stall
      - name: Replace invalid networkidle waits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          changed = []
          for path in sorted(Path('tests').glob('verify_*.mjs')):
              text = path.read_text(encoding='utf-8')
              updated = text.replace('waitUntil: "networkidle"', 'waitUntil: "domcontentloaded"')
              if updated != text:
                  path.write_text(updated, encoding='utf-8')
                  changed.append(str(path))
          if not changed:
              raise SystemExit('no networkidle waits found')
          print('\n'.join(changed))
          PY
          rm -f .github/workflows/fix-polling-browser-waits.yml
      - name: Commit browser wait migration
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Use render readiness instead of network idle in browser tests'
          git push origin HEAD:fix/diagram-preview-stall
