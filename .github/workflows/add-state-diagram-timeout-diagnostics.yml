name: Add State Diagram Timeout Diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/add-state-diagram-timeout-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Add structured timeout diagnostics
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/verify_state_diagram_rendering.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''        await page.waitForFunction(({machineName, transitionCount}) => {
          const stage = document.querySelector(".graph-stage");
          return document.querySelector("#machine-select")?.selectedOptions?.[0]?.textContent === machineName
            && stage?.dataset.transitionIoClustersReady === "true"
            && stage?.dataset.transitionIoCollisionSolved === "true"
            && stage.querySelectorAll(".transition-io-cluster").length === transitionCount;
        }, { machineName: expected.name, transitionCount: machine.transitions.length });
          '''
          new = '''        try {
          await page.waitForFunction(({machineName, transitionCount}) => {
            const stage = document.querySelector(".graph-stage");
            return document.querySelector("#machine-select")?.selectedOptions?.[0]?.textContent === machineName
              && stage?.dataset.transitionIoClustersReady === "true"
              && stage?.dataset.transitionIoCollisionSolved === "true"
              && stage.querySelectorAll(".transition-io-cluster").length === transitionCount;
          }, { machineName: expected.name, transitionCount: machine.transitions.length });
        } catch (error) {
          const diagnostic = await page.evaluate(() => {
            const stage = document.querySelector(".graph-stage");
            return {
              stage: stage ? {...stage.dataset} : null,
              selectedMachine: document.querySelector("#machine-select")?.selectedOptions?.[0]?.textContent || null,
              transaction: window.glyphTransitionLayoutTransaction ? {
                generation: window.glyphTransitionLayoutTransaction.generation,
                completedGeneration: window.glyphTransitionLayoutTransaction.completedGeneration,
                lastReason: window.glyphTransitionLayoutTransaction.lastReason,
              } : null,
              clusters: [...document.querySelectorAll(".transition-io-cluster")].map(cluster => ({
                id: cluster.dataset.transitionId,
                input: cluster.dataset.inputValue,
                guard: cluster.dataset.guardValue,
                action: cluster.dataset.actionValue,
                io: cluster.dataset.ioValue,
                collision: cluster.dataset.ioCollisionSolved,
                readability: cluster.dataset.transitionReadability,
              })),
            };
          });
          throw new Error(`${testCase.slug}/${expected.name}: diagram readiness timeout\n${JSON.stringify(diagnostic, null, 2)}\n${error.stack}`);
        }
          '''
          if old not in text:
              raise SystemExit('waitForFunction block changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit diagnostics
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/verify_state_diagram_rendering.mjs
          git commit -m "Report state diagram readiness diagnostics"
          git push origin "HEAD:${HEAD_REF}"
