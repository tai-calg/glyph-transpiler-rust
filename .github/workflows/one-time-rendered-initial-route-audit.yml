name: One-time Rendered Initial Route Audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-rendered-initial-route-audit.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/system-action-control-flow-completeness-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit actual rendered initial route before publication
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("glyph/initial_transition_layout.py")
          source = path.read_text(encoding="utf-8")

          old = '  function sampleSvgPath(path, step = 4) {'
          new = '  function sampleSvgPath(path, step = 3) {'
          if source.count(old) != 1:
              raise SystemExit(f"sampleSvgPath signature count={source.count(old)}")
          source = source.replace(old, new)

          old = '''      const best = ranked.find(item => item.crossings === 0);\n      if (!best) {\n        stage.dataset.initialRouteReady = "failed";\n        stage.dataset.initialRouteError = `no crossing-free initial route; best=${ranked[0].crossings}`;\n        stage.dataset.initialRouteCandidateCount = String(ranked.length);\n        throw Error(stage.dataset.initialRouteError);\n      }\n      delete stage.dataset.initialRouteError;\n      stage.dataset.initialRouteCandidateCount = String(ranked.length);\n      initialPath.setAttribute("d", routePath(best.candidate.points));\n      initialPath.dataset.routeSide = best.candidate.side;\n      initialPath.dataset.routeCrossings = String(best.crossings);\n      initialPath.dataset.routeClearance = Number.isFinite(best.clearance)\n        ? best.clearance.toFixed(2)\n        : "999";'''
          new = '''      let best = null;\n      for (const item of ranked) {\n        if (item.crossings !== 0) continue;\n        initialPath.setAttribute("d", routePath(item.candidate.points));\n        const rendered = sampleSvgPath(initialPath, 3);\n        const renderedCrossings = normalPolylines.reduce(\n          (sum, normal) => sum + crossingCount(rendered, normal),\n          0,\n        );\n        const renderedClearance = minimumClearance(rendered, normalPolylines);\n        if (renderedCrossings === 0 && renderedClearance >= 5) {\n          best = {...item, renderedCrossings, renderedClearance};\n          break;\n        }\n      }\n      if (!best) {\n        stage.dataset.initialRouteReady = "failed";\n        stage.dataset.initialRouteError = `no rendered crossing-free initial route; best=${ranked[0].crossings}`;\n        stage.dataset.initialRouteCandidateCount = String(ranked.length);\n        throw Error(stage.dataset.initialRouteError);\n      }\n      delete stage.dataset.initialRouteError;\n      stage.dataset.initialRouteCandidateCount = String(ranked.length);\n      initialPath.setAttribute("d", routePath(best.candidate.points));\n      initialPath.dataset.routeSide = best.candidate.side;\n      initialPath.dataset.routeCrossings = String(best.renderedCrossings);\n      initialPath.dataset.routeClearance = Number.isFinite(best.renderedClearance)\n        ? best.renderedClearance.toFixed(2)\n        : "999";'''
          if source.count(old) != 1:
              raise SystemExit(f"best route selection block count={source.count(old)}")
          source = source.replace(old, new)

          old = '''      marker.style.left = `${best.candidate.dot.x - MARKER_RADIUS}px`;\n      marker.style.top = `${best.candidate.dot.y - MARKER_RADIUS}px`;'''
          new = '''      const renderedStart = sampleSvgPath(initialPath, 3)[0] || best.candidate.dot;\n      marker.style.left = `${renderedStart.x - MARKER_RADIUS}px`;\n      marker.style.top = `${renderedStart.y - MARKER_RADIUS}px`;'''
          if source.count(old) != 1:
              raise SystemExit(f"marker positioning block count={source.count(old)}")
          source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")
          PY
          python -m py_compile glyph/initial_transition_layout.py
          python - <<'PY'
          from pathlib import Path
          source = Path("glyph/initial_transition_layout.py").read_text(encoding="utf-8")
          marker = '<script id="glyph-initial-transition-routing-v1-script">'
          start = source.index(marker) + len(marker)
          end = source.index('</script>', start)
          Path('/tmp/initial.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/initial.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/initial_transition_layout.py
          git commit -m "Audit rendered initial route geometry"
          git push origin "HEAD:${{ github.head_ref }}"
