name: Apply Assembly final hardening

on:
  push:
    branches:
      - agent/machine-assembly-immediate-routing
    paths:
      - .github/workflows/apply-assembly-final-hardening.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/machine-assembly-immediate-routing
          fetch-depth: 0

      - name: Apply hardening changes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          assembly_path = Path("glyph/assembly.py")
          assembly = assembly_path.read_text(encoding="utf-8")
          old_mapping = '''class FrozenMapping(MappingABC[str, object]):
              """Immutable mapping that cannot be bypassed through dict base methods."""

              __slots__ = ("_data",)

              def __init__(self, values: Mapping[str, object]):
                  object.__setattr__(self, "_data", dict(values))

              def __getitem__(self, key: str) -> object:
                  return self._data[key]

              def __iter__(self) -> Iterator[str]:
                  return iter(self._data)

              def __len__(self) -> int:
                  return len(self._data)

              def __repr__(self) -> str:
                  return f"FrozenMapping({self._data!r})"

              def __deepcopy__(self, memo):
                  return self
          '''
          new_mapping = '''class FrozenMapping(tuple, MappingABC[str, object]):
              """Tuple-backed immutable mapping with no mutable internal dictionary."""

              __slots__ = ()

              def __new__(cls, values: Mapping[str, object]):
                  return tuple.__new__(
                      cls,
                      tuple((str(key), value) for key, value in values.items()),
                  )

              def __getitem__(self, key: str) -> object:
                  for item_key, item_value in tuple.__iter__(self):
                      if item_key == key:
                          return item_value
                  raise KeyError(key)

              def __iter__(self) -> Iterator[str]:
                  return (key for key, _ in tuple.__iter__(self))

              def __repr__(self) -> str:
                  body = ", ".join(
                      f"{key!r}: {value!r}"
                      for key, value in tuple.__iter__(self)
                  )
                  return f"FrozenMapping({{{body}}})"

              def __deepcopy__(self, memo):
                  return self
          '''
          if old_mapping not in assembly:
              raise SystemExit("FrozenMapping source changed unexpectedly")
          assembly_path.write_text(
              assembly.replace(old_mapping, new_mapping),
              encoding="utf-8",
          )

          runtime_path = Path("glyph/assembly_runtime.py")
          runtime = runtime_path.read_text(encoding="utf-8")

          replacements = [
              (
                  'import sys\nfrom threading import RLock\n',
                  'import math\nimport sys\nfrom threading import Lock\n',
              ),
              (
                  '''_FLOAT_TYPES = {"F", "Float", "f32", "f64"}
          _STRING_TYPES = {"String", "str"}
          ''',
                  '''_INT_RANGES: dict[str, tuple[int, int]] = {
              "i8": (-(2**7), 2**7 - 1),
              "i16": (-(2**15), 2**15 - 1),
              "i32": (-(2**31), 2**31 - 1),
              "i64": (-(2**63), 2**63 - 1),
              "i128": (-(2**127), 2**127 - 1),
              "isize": (-sys.maxsize - 1, sys.maxsize),
              "u8": (0, 2**8 - 1),
              "u16": (0, 2**16 - 1),
              "u32": (0, 2**32 - 1),
              "u64": (0, 2**64 - 1),
              "u128": (0, 2**128 - 1),
              "usize": (0, 2 * sys.maxsize + 1),
          }
          _FLOAT_TYPES = {"F", "Float", "f32", "f64"}
          _FLOAT_MAX = {
              "f32": 3.4028234663852886e38,
              "f64": 1.7976931348623157e308,
          }
          _STRING_TYPES = {"String", "str"}
          ''',
              ),
              (
                  '''        self._reaction_lock = RLock()
                  self._reaction_active = False
          ''',
                  '''        self._reaction_gate = Lock()
          ''',
              ),
              (
                  '''        if name in _INT_TYPES:
                      if type(value) is not int:
                          raise GlyphError(f"{path}: {name}にはintが必要")
                      return
                  if name in _FLOAT_TYPES:
                      if type(value) not in {int, float}:
                          raise GlyphError(f"{path}: {name}には数値が必要")
                      return
          ''',
                  '''        if name in _INT_TYPES:
                      if type(value) is not int:
                          raise GlyphError(f"{path}: {name}にはintが必要")
                      bounds = _INT_RANGES.get(name)
                      if bounds is not None and not bounds[0] <= value <= bounds[1]:
                          raise GlyphError(
                              f"{path}: {name}の範囲外: {value} "
                              f"(許容範囲 {bounds[0]}..{bounds[1]})"
                          )
                      return
                  if name in _FLOAT_TYPES:
                      if type(value) not in {int, float}:
                          raise GlyphError(f"{path}: {name}には数値が必要")
                      try:
                          numeric = float(value)
                      except (OverflowError, ValueError) as exc:
                          raise GlyphError(f"{path}: {name}へ変換できない数値") from exc
                      if not math.isfinite(numeric):
                          raise GlyphError(f"{path}: {name}には有限値が必要")
                      maximum = _FLOAT_MAX.get(name)
                      if maximum is not None and abs(numeric) > maximum:
                          raise GlyphError(
                              f"{path}: {name}の表現範囲外: {value} "
                              f"(最大絶対値 {maximum})"
                          )
                      return
          ''',
              ),
              (
                  '''        # One top-level reaction owns a complete working configuration. A nested
                  # call from a Host callback would otherwise overwrite its inner commit.
                  # RLock serializes other threads while allowing same-thread re-entry to be
                  # diagnosed instead of deadlocking.
                  with self._reaction_lock:
                      if self._reaction_active:
                          raise GlyphError(
                              "同一Assembly Runtimeへのtop-level反応の再入は禁止"
                          )
                      self._reaction_active = True
                      try:
                          return self._react_locked(
                              instance,
                              input_name,
                              value,
                              handler,
                              host_executor,
                          )
                      finally:
                          self._reaction_active = False
          ''',
                  '''        # A running reaction owns the complete working configuration. Reject every
                  # same-thread or cross-thread competing call without waiting. A Host
                  # callback may join the competing thread, so blocking here could deadlock.
                  if not self._reaction_gate.acquire(blocking=False):
                      raise GlyphError(
                          "同一Assembly Runtimeへのtop-level反応の再入・並行実行は禁止"
                      )
                  try:
                      return self._react_locked(
                          instance,
                          input_name,
                          value,
                          handler,
                          host_executor,
                      )
                  finally:
                      self._reaction_gate.release()
          ''',
              ),
              (
                  '''                            raw_result = host_executor(
                                      target,
                                      invocation.effect,
                                      host_arguments,
                                  )
          ''',
                  '''                            audit_arguments = tuple(
                                      self._clone(
                                          argument,
                                          f"Host audit argument {target}.{invocation.effect}",
                                      )
                                      for argument in host_arguments
                                  )
                                  raw_result = host_executor(
                                      target,
                                      invocation.effect,
                                      host_arguments,
                                  )
          ''',
              ),
              (
                  '''                                    arguments=tuple(
                                          self._clone(item, "external effect argument")
                                          for item in host_arguments
                                      ),
          ''',
                  '''                                    arguments=audit_arguments,
          ''',
              ),
          ]
          for old, new in replacements:
              if old not in runtime:
                  raise SystemExit("Assembly Runtime source changed unexpectedly:\n" + old)
              runtime = runtime.replace(old, new, 1)
          runtime_path.write_text(runtime, encoding="utf-8")

          test_path = Path("tests/test_machine_assembly_runtime_hardening_v2.py")
          test_path.write_text(r'''from __future__ import annotations

          import math
          from pathlib import Path
          from threading import Event, Thread
          import unittest

          from glyph import parse_compilation_model
          from glyph.assembly_runtime import EffectInvocation, ImmediateAssemblyRuntime
          from glyph.compiler import GlyphError


          EXAMPLE = Path("examples/machine_assembly_immediate.glyph").read_text(
              encoding="utf-8"
          )
          EXAMPLE_INITIAL = {
              "door": {"mode": "DoorLocked"},
              "safety": {"mode": "SafetyNormal"},
              "motor": {"mode": "MotorRunning"},
          }


          def scalar_source(type_name: str) -> str:
              return f"""\
          +Mode=Idle|Done|Fault
          *State(mode:Mode)

          >next(state:State,input:{type_name}):State=state

          machine Scalar(state:State,input:{type_name})
            select=state.mode
            init=State(Idle)
            next=next(state,input)
            success=Done
            failure=Fault

          assembly ScalarAssembly
            scalar=Scalar
          """


          HOST_SNAPSHOT_SOURCE = """\
          +Input=Trigger
          +Mode=Idle|Done|Fault
          *State(mode:Mode)
          *Payload(value:I)

          !write(payload:Payload):()

          >fire(state:State):State
            result := write(Payload(1))
            State(Done)

          >next(state:State,input:Input):State
            input==Trigger>>fire(state)
            _>>state

          machine Actor(state:State,input:Input)
            select=state.mode
            init=State(Idle)
            next=next(state,input)
            success=Done
            failure=Fault

          assembly Single
            actor=Actor
          """


          class MachineAssemblyRuntimeHardeningV2Tests(unittest.TestCase):
              def test_frozen_mapping_has_no_mutable_internal_storage(self) -> None:
                  record = parse_compilation_model(EXAMPLE).assembly_ir[0].instances[0]

                  self.assertIsInstance(record, tuple)
                  self.assertFalse(hasattr(record, "_data"))
                  with self.assertRaises(AttributeError):
                      object.__setattr__(record, "_data", {})
                  with self.assertRaises(TypeError):
                      dict.__setitem__(record, "machine", "Other")
                  self.assertEqual(record["machine"], "Door")

              def test_cross_thread_host_reentry_fails_without_deadlock(self) -> None:
                  ir = parse_compilation_model(EXAMPLE).assembly_ir[0]
                  runtime = ImmediateAssemblyRuntime(ir, EXAMPLE_INITIAL)
                  worker_done = Event()
                  worker_errors: list[BaseException] = []

                  def handler(instance: str, input_name: str, value: object, state: object):
                      receipt = yield EffectInvocation("write_motor", "DisableMotor")
                      self.assertEqual(receipt, {"command": "DisableMotor"})
                      return {"mode": "MotorStopped"}

                  def host(instance: str, effect: str, arguments: tuple[object, ...]):
                      def competing_reaction() -> None:
                          try:
                              runtime.react(
                                  "motor",
                                  "input",
                                  "StopRequested",
                                  handler,
                                  host,
                              )
                          except BaseException as exc:
                              worker_errors.append(exc)
                          finally:
                              worker_done.set()

                      worker = Thread(target=competing_reaction)
                      worker.start()
                      self.assertTrue(worker_done.wait(1.0), "competing react() deadlocked")
                      worker.join(1.0)
                      self.assertFalse(worker.is_alive(), "competing react() did not terminate")
                      return {"command": arguments[0]}

                  result = runtime.react(
                      "motor",
                      "input",
                      "StopRequested",
                      handler,
                      host,
                  )

                  self.assertEqual(result.states["motor"], {"mode": "MotorStopped"})
                  self.assertEqual(len(worker_errors), 1)
                  self.assertIsInstance(worker_errors[0], GlyphError)
                  self.assertIn("再入・並行実行は禁止", str(worker_errors[0]))

              def test_fixed_width_integer_ranges_are_enforced(self) -> None:
                  model = parse_compilation_model(scalar_source("u8"))
                  runtime = ImmediateAssemblyRuntime(
                      model.assembly_ir[0],
                      {"scalar": {"mode": "Idle"}},
                  )

                  def handler(instance: str, input_name: str, value: object, state: object):
                      if False:
                          yield EffectInvocation("never")
                      return state

                  runtime.react("scalar", "input", 0, handler)
                  runtime.react("scalar", "input", 255, handler)
                  for invalid in (-1, 256):
                      with self.subTest(invalid=invalid):
                          with self.assertRaisesRegex(GlyphError, "u8の範囲外"):
                              runtime.react("scalar", "input", invalid, handler)

              def test_float_values_must_be_finite_and_in_range(self) -> None:
                  model = parse_compilation_model(scalar_source("f32"))
                  runtime = ImmediateAssemblyRuntime(
                      model.assembly_ir[0],
                      {"scalar": {"mode": "Idle"}},
                  )

                  def handler(instance: str, input_name: str, value: object, state: object):
                      if False:
                          yield EffectInvocation("never")
                      return state

                  runtime.react("scalar", "input", 3.4e38, handler)
                  for invalid in (math.nan, math.inf, -math.inf):
                      with self.subTest(invalid=invalid):
                          with self.assertRaisesRegex(GlyphError, "有限値"):
                              runtime.react("scalar", "input", invalid, handler)
                  with self.assertRaisesRegex(GlyphError, "f32の表現範囲外"):
                      runtime.react("scalar", "input", 3.5e38, handler)

              def test_external_effect_records_pre_host_argument_snapshot(self) -> None:
                  model = parse_compilation_model(HOST_SNAPSHOT_SOURCE)
                  runtime = ImmediateAssemblyRuntime(
                      model.assembly_ir[0],
                      {"actor": {"mode": "Idle"}},
                  )

                  def handler(instance: str, input_name: str, value: object, state: object):
                      yield EffectInvocation("write", {"value": 1})
                      return {"mode": "Done"}

                  def mutating_host(
                      instance: str,
                      effect: str,
                      arguments: tuple[object, ...],
                  ) -> None:
                      arguments[0]["value"] = 99
                      return None

                  result = runtime.react(
                      "actor",
                      "input",
                      "Trigger",
                      handler,
                      mutating_host,
                  )

                  self.assertEqual(
                      result.external_effects[0].arguments,
                      ({"value": 1},),
                  )


          if __name__ == "__main__":
              unittest.main()
          '''.replace("\n          ", "\n").lstrip(), encoding="utf-8")
          PY

      - name: Run focused Assembly tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            glyph/assembly.py \
            glyph/assembly_runtime.py \
            tests/test_machine_assembly_runtime_hardening_v2.py
          python -m pytest -q \
            tests/test_machine_assembly.py \
            tests/test_machine_assembly_hardening.py \
            tests/test_machine_assembly_runtime_types.py \
            tests/test_machine_assembly_runtime_hardening_v2.py

      - name: Commit verified hardening
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-assembly-final-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden Assembly immutability and runtime boundaries"
          git push origin HEAD:agent/machine-assembly-immediate-routing
