name: Apply transition block decision support

on:
  pull_request:
    branches:
      - agent/revert-invalid-readme-action-image

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/transition-block-decision-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revert-invalid-readme-action-image
          fetch-depth: 0

      - name: Apply immutable block decision support
        run: python3 tools/_apply_transition_block_decision_support.py

      - name: Run focused preimage suite
        run: |
          set -o pipefail
          python3 -m unittest \
            tests.test_transition_input_provenance \
            tests.test_transition_input_provenance_audit \
            tests.test_transition_input_preimage_generalization \
            tests.test_transition_block_decision_preimage \
            tests.test_io_state_diagram_app 2>&1 | tee /tmp/block-decision-tests.log

      - name: Upload focused test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: block-decision-test-log
          path: /tmp/block-decision-tests.log

      - name: Commit block decision support
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glyph/transition_input_provenance.py
          git commit -m "Resolve Input preimages through immutable decision blocks"
          git push origin HEAD:agent/revert-invalid-readme-action-image
