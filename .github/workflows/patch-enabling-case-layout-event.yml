name: Patch Enabling Case Layout Event

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-enabling-case-layout-event.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Subscribe layout transaction to enabling-case rendering
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('glyph/transition_layout_transaction.py')
          text = path.read_text(encoding='utf-8')
          old = 'for(const eventName of["glyph-state-transition-ir-v3-labels-ready","glyph-uml-transition-ready","glyph-locale-changed"]){'
          new = 'for(const eventName of["glyph-state-transition-ir-v3-labels-ready","glyph-transition-enabling-cases-ready","glyph-uml-transition-ready","glyph-locale-changed"]){'
          if old not in text:
              raise SystemExit('layout transaction event list changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit patch
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/transition_layout_transaction.py
          git commit -m "Re-layout after enabling-case rendering"
          git push origin "HEAD:${HEAD_REF}"
