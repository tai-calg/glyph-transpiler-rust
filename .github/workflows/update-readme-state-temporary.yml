name: Temporary README State Snapshot Update

on:
  push:
    branches:
      - agent/macro-space-syntax

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macro-space-syntax
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install renderer
        run: |
          python -m pip install pillow==12.0.0
          npm install playwright@1.54.2
          npx playwright install --with-deps chromium
      - name: Regenerate README state image
        run: |
          node tests/verify_state_diagram_rendering.mjs
          UPDATE_README_STATE_DIAGRAM=1 python tests/verify_readme_state_snapshot.py
      - name: Commit generated image
        run: |
          if git diff --quiet -- docs/images/glyph-studio-state-transition.png; then
            echo 'README image already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/images/glyph-studio-state-transition.png
          git commit -m 'Update README state diagram snapshot'
          git push origin HEAD:agent/macro-space-syntax
