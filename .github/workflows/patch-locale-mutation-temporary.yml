name: Temporary Locale Mutation Patch

on:
  push:
    branches:
      - agent/macro-space-syntax

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/macro-space-syntax
      - name: Break locale and save-state mutation feedback
        run: |
          python - <<'PY'
          from pathlib import Path

          controller = Path('glyph/diagram_save_controller.py')
          text = controller.read_text()
          old = '''document.addEventListener("glyph-locale-applied",updateUi);
          document.addEventListener("glyph-locale-changed",updateUi);'''
          new = '''document.addEventListener("glyph-locale-changed",updateUi);'''
          if old not in text:
              raise SystemExit('save controller locale listener anchor missing')
          controller.write_text(text.replace(old, new, 1))

          locale = Path('glyph/diagram_locale.py')
          text = locale.read_text()
          old = '''let scheduled=false;function enhance(){if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;installOverrides();installSettings();apply()})}
          new MutationObserver(enhance).observe(document.body,{childList:true,subtree:true});document.addEventListener("glyph-state-transition-ir-v3-labels-ready",enhance);document.addEventListener("glyph-transition-layout-ready",enhance);enhance();'''
          new = '''let scheduled=false;function enhance(){if(scheduled)return;scheduled=true;queueMicrotask(()=>{scheduled=false;installOverrides();installSettings();apply()})}
          const SAVE_UI_SELECTOR="#glyph-save-state,#glyph-stale-banner,#glyph-conflict-dialog";
          function mutationTarget(record){const target=record.target;return target?.nodeType===Node.ELEMENT_NODE?target:target?.parentElement||null}
          function saveUiOnly(records){return records.length>0&&records.every(record=>Boolean(mutationTarget(record)?.closest?.(SAVE_UI_SELECTOR)))}
          new MutationObserver(records=>{if(saveUiOnly(records))return;enhance()}).observe(document.body,{childList:true,subtree:true});document.addEventListener("glyph-state-transition-ir-v3-labels-ready",enhance);document.addEventListener("glyph-transition-layout-ready",enhance);enhance();'''
          if old not in text:
              raise SystemExit('diagram locale observer anchor missing')
          locale.write_text(text.replace(old, new, 1))
          PY
      - name: Commit mutation fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add glyph/diagram_locale.py glyph/diagram_save_controller.py
          git commit -m 'Prevent locale and save-state mutation feedback'
          git push origin HEAD:agent/macro-space-syntax
