name: Bootstrap transition action semantics

on:
  push:
    branches:
      - agent/transition-action-semantics-v4

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transition-action-semantics-v4
          fetch-depth: 0

      - name: Implement action projection and renderer contract
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              target = Path(path)
              text = target.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:100]!r}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          machine = "glyph/machine.py"
          replace_once(
              machine,
              '_REQUIRED_PROPERTIES = ("select", "init", "next", "success", "failure")\n',
              '_REQUIRED_PROPERTIES = ("select", "init", "next", "success", "failure")\n'
              '_OPTIONAL_PROPERTIES = ("action",)\n'
              '_ALLOWED_PROPERTIES = (*_REQUIRED_PROPERTIES, *_OPTIONAL_PROPERTIES)\n',
          )
          replace_once(
              machine,
              '    failure_line: int\n\n    @property\n',
              '    failure_line: int\n'
              '    action_selector: Expr | None = None\n'
              '    action_line: int | None = None\n\n'
              '    @property\n',
          )
          replace_once(
              machine,
              '            if key not in _REQUIRED_PROPERTIES:\n'
              '                raise GlyphError(\n'
              '                    f"{body_line}行目: 不明なmachineプロパティ \'{key}\'。"\n'
              '                    f"使用可能: {\', \'.join(_REQUIRED_PROPERTIES)}"\n'
              '                )\n',
              '            if key not in _ALLOWED_PROPERTIES:\n'
              '                raise GlyphError(\n'
              '                    f"{body_line}行目: 不明なmachineプロパティ \'{key}\'。"\n'
              '                    f"使用可能: {\', \'.join(_ALLOWED_PROPERTIES)}"\n'
              '                )\n',
          )
          replace_once(
              machine,
              '        for key in ("select", "init", "next"):\n'
              '            _reject_single_equal(properties[key][0], properties[key][1])\n',
              '        for key in ("select", "action", "init", "next"):\n'
              '            if key in properties:\n'
              '                _reject_single_equal(properties[key][0], properties[key][1])\n',
          )
          replace_once(
              machine,
              '            failure_line=properties["failure"][1],\n'
              '        )\n',
              '            failure_line=properties["failure"][1],\n'
              '            action_selector=(\n'
              '                parse_expr(properties["action"][0], macros)\n'
              '                if "action" in properties\n'
              '                else None\n'
              '            ),\n'
              '            action_line=(properties["action"][1] if "action" in properties else None),\n'
              '        )\n',
          )
          replace_once(
              machine,
              'def _direct_call(expr: Expr, line: int, label: str) -> CallExpr:\n',
              'def _action_field(machine: MachineDecl) -> str | None:\n'
              '    action = machine.action_selector\n'
              '    if action is None:\n'
              '        return None\n'
              '    if not (\n'
              '        isinstance(action, FieldExpr)\n'
              '        and isinstance(action.base, NameExpr)\n'
              '        and action.base.name == machine.state_param.name\n'
              '    ):\n'
              '        line = machine.action_line or machine.line\n'
              '        raise GlyphError(\n'
              '            f"{line}行目: actionは \'{machine.state_param.name}.field\' の形式で記述する"\n'
              '        )\n'
              '    return action.field\n\n\n'
              'def _direct_call(expr: Expr, line: int, label: str) -> CallExpr:\n',
          )
          replace_once(
              machine,
              '        variants = {variant.name for variant in selector_sum.variants}\n\n'
              '        initial_call = _direct_call(machine.initial, machine.initial_line, "init")\n',
              '        variants = {variant.name for variant in selector_sum.variants}\n\n'
              '        action_name = _action_field(machine)\n'
              '        if action_name is not None:\n'
              '            action_index = next(\n'
              '                (index for index, field in enumerate(state_decl.fields) if field.name == action_name),\n'
              '                None,\n'
              '            )\n'
              '            line = machine.action_line or machine.line\n'
              '            if action_index is None:\n'
              '                raise GlyphError(\n'
              '                    f"{line}行目: 状態型 \'{state_decl.name}\' にAction field \'{action_name}\' がない"\n'
              '                )\n'
              '            if action_index == selector_index:\n'
              '                raise GlyphError(\n'
              '                    f"{line}行目: actionとselectは同じfield \'{action_name}\' を参照できない"\n'
              '                )\n'
              '            action_type = state_decl.fields[action_index].ty\n'
              '            action_sum = sums.get(action_type.name)\n'
              '            if action_sum is None or action_type.args:\n'
              '                raise GlyphError(\n'
              '                    f"{line}行目: action対象 \'{action_name}\' の型 \'{action_type.name}\' は直和型でなければならない"\n'
              '                )\n\n'
              '        initial_call = _direct_call(machine.initial, machine.initial_line, "init")\n',
          )

          renderer = "glyph/transition_io_clusters.py"
          replace_once(
              renderer,
              'function outputOf(transition){return text(transition?.action)||text(transition?.target_state)||text(transition?.target?.state)||text(transition?.target?.name)}\n'
              'function ioOf(transition){const input=inputOf(transition),guard=guardsOf(transition).join(" & "),output=outputOf(transition);return`${input}${guard?` [${guard}]`:""}${output?` ➞ ${output}`:""}`}\n',
              'function actionOf(transition){const action=transition?.action;if(typeof action==="string")return text(action);return text(action?.display)||text(action?.expression)}\n'
              'function ioOf(transition){const input=inputOf(transition),guard=guardsOf(transition).join(" & "),action=actionOf(transition);return`${input}${guard?` [${guard}]`:""}${action?` ➞ ${action}`:""}`}\n',
          )
          replace_once(
              renderer,
              'function signatureOf(machine){return[window.GlyphI18n?.locale||document.documentElement.lang||"ja",machine?.name||"",...(machine?.transitions||[]).map(item=>[item.id||"",JSON.stringify(item.trigger||null),JSON.stringify(item.guards||[]),JSON.stringify(item.unclassified_conditions||[]),item.action||"",item.target_state||"",JSON.stringify(item.target||null)].join("\\u001f"))].join("\\u001e")}\n',
              'function signatureOf(machine){return[window.GlyphI18n?.locale||document.documentElement.lang||"ja",machine?.name||"",...(machine?.transitions||[]).map(item=>[item.id||"",JSON.stringify(item.trigger||null),JSON.stringify(item.guards||[]),JSON.stringify(item.unclassified_conditions||[]),JSON.stringify(item.action||null)].join("\\u001f"))].join("\\u001e")}\n',
          )
          replace_once(
              renderer,
              'function updateCluster(cluster,transition,id,line){const semantic=JSON.stringify([window.GlyphI18n?.locale||document.documentElement.lang,inputOf(transition),guardsOf(transition),outputOf(transition)]);if(cluster.dataset.semanticSignature!==semantic){cluster.innerHTML=clusterMarkup(transition);cluster.dataset.semanticSignature=semantic}const trigger=triggerOf(transition),unknown=unknownOf(transition).length>0;cluster.dataset.transitionId=id;cluster.dataset.line=String(line||0);cluster.dataset.inputValue=inputOf(transition);cluster.dataset.outputValue=outputOf(transition);cluster.dataset.ioValue=ioOf(transition);cluster.dataset.guardValue=guardsOf(transition).join(" & ");cluster.dataset.fullLabel=fullSummary(transition);cluster.classList.toggle("provisional-trigger",trigger?.role==="provisional-trigger");cluster.classList.toggle("unclassified-condition",unknown);cluster.title=`${fullSummary(transition)}\\n${evidenceOf(transition)}`.trim();cluster.setAttribute("role","group");cluster.setAttribute("aria-label",fullSummary(transition))}\n',
              'function updateCluster(cluster,transition,id,line){const semantic=JSON.stringify([window.GlyphI18n?.locale||document.documentElement.lang,inputOf(transition),guardsOf(transition),actionOf(transition)]);if(cluster.dataset.semanticSignature!==semantic){cluster.innerHTML=clusterMarkup(transition);cluster.dataset.semanticSignature=semantic}const trigger=triggerOf(transition),unknown=unknownOf(transition).length>0;cluster.dataset.transitionId=id;cluster.dataset.line=String(line||0);cluster.dataset.inputValue=inputOf(transition);cluster.dataset.actionValue=actionOf(transition);cluster.dataset.outputValue=actionOf(transition);cluster.dataset.ioValue=ioOf(transition);cluster.dataset.guardValue=guardsOf(transition).join(" & ");cluster.dataset.fullLabel=fullSummary(transition);cluster.classList.toggle("provisional-trigger",trigger?.role==="provisional-trigger");cluster.classList.toggle("unclassified-condition",unknown);cluster.title=`${fullSummary(transition)}\\n${evidenceOf(transition)}`.trim();cluster.setAttribute("role","group");cluster.setAttribute("aria-label",fullSummary(transition))}\n',
          )
          replace_once(
              renderer,
              '    """Render one compact input [guard] ➞ output label per transition."""\n',
              '    """Render one compact input [guard] ➞ action label per transition."""\n',
          )

          example = Path("examples/acceptance/door_controller.glyph")
          text = example.read_text(encoding="utf-8")
          anchor = "  select=state.mode\n"
          if "  action=state.action\n" not in text:
              if anchor not in text:
                  raise SystemExit("door controller select anchor missing")
              text = text.replace(anchor, anchor + "  action=state.action\n", 1)
              example.write_text(text, encoding="utf-8")

          Path("tests/test_machine_action_projection.py").write_text(r'''from __future__ import annotations

import unittest

from glyph.compiler import GlyphError, parse_program
from glyph.machine import extract_machines, validate_machines


VALID = """\
machine Door(state:DoorState,input:Input)
  select=state.mode
  action=state.action
  init=DoorState(Locked,KeepLocked)
  next=step(state,input)
  success=Unlocked
  failure=Faulted

+Input=OpenRequest|NoRequest
+Mode=Locked|Unlocked|Faulted
+Action=KeepLocked|Unlock
*DoorState(mode:Mode,action:Action)

>step(state:DoorState,input:Input):DoorState=DoorState(Unlocked,Unlock)
"""


class MachineActionProjectionTests(unittest.TestCase):
    def compile_machine(self, source: str):
        remainder, machines = extract_machines(source)
        program = parse_program(remainder)
        validate_machines(program, machines)
        self.assertEqual(len(machines), 1)
        return machines[0]

    def test_action_projection_is_optional_and_typed(self) -> None:
        machine = self.compile_machine(VALID)
        self.assertIsNotNone(machine.action_selector)
        self.assertEqual(machine.action_selector.field, "action")

        legacy = VALID.replace("  action=state.action\n", "")
        legacy_machine = self.compile_machine(legacy)
        self.assertIsNone(legacy_machine.action_selector)

    def test_action_and_select_cannot_share_a_field(self) -> None:
        source = VALID.replace("action=state.action", "action=state.mode")
        remainder, machines = extract_machines(source)
        with self.assertRaisesRegex(GlyphError, "actionとselectは同じfield"):
            validate_machines(parse_program(remainder), machines)

    def test_action_projection_must_target_a_sum_typed_state_field(self) -> None:
        source = VALID.replace("action=state.action", "action=state.count").replace(
            "*DoorState(mode:Mode,action:Action)",
            "*DoorState(mode:Mode,action:Action,count:U)",
        ).replace(
            "DoorState(Locked,KeepLocked)",
            "DoorState(Locked,KeepLocked,0)",
        ).replace(
            "DoorState(Unlocked,Unlock)",
            "DoorState(Unlocked,Unlock,0)",
        )
        remainder, machines = extract_machines(source)
        with self.assertRaisesRegex(GlyphError, "直和型でなければならない"):
            validate_machines(parse_program(remainder), machines)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")

          Path("tests/test_transition_action_renderer_contract.py").write_text(r'''from __future__ import annotations

import unittest

from glyph.transition_io_clusters import enhance_transition_io_clusters_html


class TransitionActionRendererContractTests(unittest.TestCase):
    def test_target_state_is_never_used_as_action_fallback(self) -> None:
        rendered = enhance_transition_io_clusters_html("<html><head></head><body></body></html>")
        self.assertIn("function actionOf(transition)", rendered)
        self.assertNotIn("function outputOf(transition)", rendered)
        self.assertNotIn("||text(transition?.target_state)", rendered)
        self.assertNotIn("||text(transition?.target?.state)", rendered)
        self.assertIn("cluster.dataset.actionValue=actionOf(transition)", rendered)


if __name__ == "__main__":
    unittest.main()
''', encoding="utf-8")
          PY

      - name: Run focused tests
        run: |
          python -m unittest tests.test_machine_action_projection tests.test_transition_action_renderer_contract

      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add glyph/machine.py glyph/transition_io_clusters.py examples/acceptance/door_controller.glyph tests/test_machine_action_projection.py tests/test_transition_action_renderer_contract.py
          git commit -m "Start transition action semantics v4"
          git push origin HEAD:agent/transition-action-semantics-v4
