name: Apply transition Input preimage contract

on:
  pull_request:
    branches:
      - agent/revert-invalid-readme-action-image

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/input-preimage-contract-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/revert-invalid-readme-action-image
          fetch-depth: 0

      - name: Apply semantic test and browser contract updates
        run: python3 tools/_apply_transition_input_preimage_contract.py

      - name: Run focused compiler tests
        run: |
          python3 -m unittest \
            tests.test_transition_input_provenance \
            tests.test_transition_semantics.TransitionSemanticsTests.test_block_local_sum_value_is_inferred_from_input_dataflow

      - name: Commit contract updates
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_transition_semantics.py tests/verify_state_diagram_rendering.mjs
          git commit -m "Verify Input preimages before rendering Actions"
          git push origin HEAD:agent/revert-invalid-readme-action-image
