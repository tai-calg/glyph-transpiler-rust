name: Patch README v4 screenshots

on:
  pull_request:
    branches:
      - agent/transition-action-semantics-v4

permissions:
  actions: read
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/readme-v4-screenshot-trigger'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/transition-action-semantics-v4
          fetch-depth: 0

      - name: Download verified Snapshot artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/readme-v4-artifact
          mkdir -p /tmp/readme-v4-artifact
          gh run download 30346250801 \
            --repo tai-calg/glyph-transpiler-rust \
            --name state-diagram-regression \
            --dir /tmp/readme-v4-artifact

      - name: Replace README screenshots
        run: |
          cp /tmp/readme-v4-artifact/build/state-diagram-regression/motor-safety-motor.png \
            docs/images/glyph-studio-state-transition.png
          cp /tmp/readme-v4-artifact/build/checked-system-context-io/door-controller-checked-system-context.png \
            docs/images/glyph-studio-io.png

          python - <<'PY'
          from pathlib import Path
          from PIL import Image

          expected = {
              Path('docs/images/glyph-studio-state-transition.png'): (1800, 1100),
              Path('docs/images/glyph-studio-io.png'): (1800, 1100),
          }
          for path, size in expected.items():
              with Image.open(path) as image:
                  if image.format != 'PNG':
                      raise SystemExit(f'{path}: expected PNG, got {image.format}')
                  if image.size != size:
                      raise SystemExit(f'{path}: expected {size}, got {image.size}')
              if path.stat().st_size < 100_000:
                  raise SystemExit(f'{path}: unexpectedly small ({path.stat().st_size} bytes)')

          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          old = 'Motor Safetyの状態、初期遷移、到達可能・到達不能状態、入力・ガード・遷移結果を一画面へ表示しています。'
          new = 'Motor Safetyの状態、初期遷移、到達可能・到達不能状態、入力・ガード・Actionを一画面へ表示しています。状態名とActionは別の意味として描画されます。'
          if old not in text:
              raise SystemExit('README state-diagram description anchor is missing')
          readme.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit README screenshots
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md \
            docs/images/glyph-studio-state-transition.png \
            docs/images/glyph-studio-io.png
          git commit -m "Update README screenshots for Action semantics v4"
          git push origin HEAD:agent/transition-action-semantics-v4
