name: One-time Initial Route Search

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/one-time-initial-route-search.yml"

permissions:
  contents: write

jobs:
  patch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/system-action-control-flow-completeness-v2'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Expand and fail-close initial route search
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("glyph/initial_transition_layout.py")
          source = path.read_text(encoding="utf-8")

          old = '''  function candidateRoutes(target) {\n    const tangentOffsets = [-48, 0, 48];\n    const fractions = [.28, .72];'''
          new = '''  function candidateRoutes(target) {\n    const tangentOffsets = [-84, -56, -28, 0, 28, 56, 84];\n    const fractions = [.12, .25, .38, .5, .62, .75, .88];\n    const laneDistances = [24, 40, 56];'''
          if source.count(old) != 1:
              raise SystemExit(f"candidate header count={source.count(old)}")
          source = source.replace(old, new)

          old = '''        for (const tangentOffset of tangentOffsets) {\n          const lane = point(\n            port.x + side.outward.x * 28,\n            port.y + side.outward.y * 28,\n          );\n          const dot = point(\n            port.x + side.outward.x * 76 + side.tangent.x * tangentOffset,\n            port.y + side.outward.y * 76 + side.tangent.y * tangentOffset,\n          );\n          const elbow = side.name === "top" || side.name === "bottom"\n            ? point(dot.x, lane.y)\n            : point(lane.x, dot.y);\n          const raw = [dot, elbow, lane, port].filter((item, index, values) => (\n            index === 0 || distance(item, values[index - 1]) > .5\n          ));\n          candidates.push({side: side.name, dot, port, points: shortenFromDot(raw)});\n        }'''
          new = '''        for (const laneDistance of laneDistances) {\n          for (const tangentOffset of tangentOffsets) {\n            const lane = point(\n              port.x + side.outward.x * laneDistance,\n              port.y + side.outward.y * laneDistance,\n            );\n            const dotDistance = Math.max(88, laneDistance + 48);\n            const dot = point(\n              port.x + side.outward.x * dotDistance + side.tangent.x * tangentOffset,\n              port.y + side.outward.y * dotDistance + side.tangent.y * tangentOffset,\n            );\n            const elbow = side.name === "top" || side.name === "bottom"\n              ? point(dot.x, lane.y)\n              : point(lane.x, dot.y);\n            const raw = [dot, elbow, lane, port].filter((item, index, values) => (\n              index === 0 || distance(item, values[index - 1]) > .5\n            ));\n            candidates.push({side: side.name, dot, port, points: shortenFromDot(raw)});\n          }\n        }'''
          if source.count(old) != 1:
              raise SystemExit(f"candidate body count={source.count(old)}")
          source = source.replace(old, new)

          old = '''      const labelObstacles = [...stage.querySelectorAll(".edge-label.transition-label")]\n        .map(label => expanded(stageRect(label), LABEL_CLEARANCE));'''
          new = '''      const labelObstacles = [\n        ...stage.querySelectorAll(".edge-label.transition-label"),\n        ...stage.querySelectorAll(".transition-io-cluster"),\n      ].map(label => expanded(stageRect(label), LABEL_CLEARANCE));'''
          if source.count(old) != 1:
              raise SystemExit(f"label obstacle count={source.count(old)}")
          source = source.replace(old, new)

          old = '''      if (!ranked.length) return;\n\n      const best = ranked[0];'''
          new = '''      if (!ranked.length) {\n        stage.dataset.initialRouteReady = "failed";\n        stage.dataset.initialRouteError = "no route candidate avoids nodes and labels";\n        throw Error(stage.dataset.initialRouteError);\n      }\n\n      const best = ranked.find(item => item.crossings === 0);\n      if (!best) {\n        stage.dataset.initialRouteReady = "failed";\n        stage.dataset.initialRouteError = `no crossing-free initial route; best=${ranked[0].crossings}`;\n        stage.dataset.initialRouteCandidateCount = String(ranked.length);\n        throw Error(stage.dataset.initialRouteError);\n      }\n      delete stage.dataset.initialRouteError;\n      stage.dataset.initialRouteCandidateCount = String(ranked.length);'''
          if source.count(old) != 1:
              raise SystemExit(f"ranked selection count={source.count(old)}")
          source = source.replace(old, new)

          old = '''  async function readMachine() {\n    const response = await fetch("/api/state", {cache: "no-store"});'''
          new = '''  async function readMachine() {\n    const live = typeof snapshot === "object" && snapshot ? snapshot : null;\n    if (live) return selectedMachine(live);\n    const response = await fetch("/api/state", {cache: "no-store"});'''
          if source.count(old) != 1:
              raise SystemExit(f"readMachine count={source.count(old)}")
          source = source.replace(old, new)

          path.write_text(source, encoding="utf-8")
          PY
          python -m py_compile glyph/initial_transition_layout.py
          python - <<'PY'
          from pathlib import Path
          source = Path("glyph/initial_transition_layout.py").read_text(encoding="utf-8")
          marker = '<script id="glyph-initial-transition-routing-v1-script">'
          start = source.index(marker) + len(marker)
          end = source.index('</script>', start)
          Path('/tmp/initial.js').write_text(source[start:end], encoding='utf-8')
          PY
          node --check /tmp/initial.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/initial_transition_layout.py
          git commit -m "Require crossing-free initial transition routing"
          git push origin "HEAD:${{ github.head_ref }}"
