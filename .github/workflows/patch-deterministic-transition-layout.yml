name: Patch Deterministic Transition Layout

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/patch-deterministic-transition-layout.yml"

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Replace wall-clock search with deterministic budget
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('glyph/transition_layout_transaction.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'const RINGS=[0,12,24,36,48,60,72,84,96],ANGLES=72,OPTION_LIMIT=144,SEARCH_MS=1800;':
              'const RINGS=[0,12,24,36,48,60,72,84,96],ANGLES=72,OPTION_LIMIT=144,SEARCH_STEPS=1000000;',
              'function solveEntries(entries,deadline){\n  const ordered=[...entries].sort((left,right)=>Number(right.manual)-Number(left.manual)||left.options.length-right.options.length||left.index-right.index);\n  const assignment=new Map(),placed=[];\n  function visit(index){\n    if(index>=ordered.length)return true;\n    if(performance.now()>deadline)return false;':
              'function solveEntries(entries,stepLimit=SEARCH_STEPS){\n  const ordered=[...entries].sort((left,right)=>Number(right.manual)-Number(left.manual)||left.options.length-right.options.length||left.index-right.index);\n  const assignment=new Map(),placed=[];\n  let steps=0;\n  function visit(index){\n    if(index>=ordered.length)return true;\n    steps+=1;\n    if(steps>stepLimit)return false;',
              'const assignment=solveEntries(entries,performance.now()+SEARCH_MS)||greedyEntries(entries);':
              'const assignment=solveEntries(entries)||greedyEntries(entries);',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'deterministic layout source changed: {old[:80]}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit deterministic layout
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add glyph/transition_layout_transaction.py
          git commit -m "Make transition layout search deterministic"
          git push origin "HEAD:${HEAD_REF}"
