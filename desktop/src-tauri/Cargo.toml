[package]
name = "glyph-desktop"
version = "0.4.0"
description = "Desktop shell for Glyph Studio"
authors = ["tai-calg"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "glyph_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "glyph-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tokio = { version = "1", features = ["sync", "time"] }
rfd = "0.15"
